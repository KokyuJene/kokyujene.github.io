<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Widget</title>

<style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            display: flex;
            text-align: center;
            align-items: center;
            justify-content: center;
        }

        body.light {
            background-color: var(--bg-light);
            color: #3a3a3a;
        }

.wrapper {
    padding: 20px;
}

.button {
    display: inline-block;
    margin-top: 14px;
    padding: 12px 18px;
    width: 300px;
    background: #6b7b8c;
    color: white;
    font-size: 0.95rem;
    border-radius: 8px;
    text-decoration: none;
    transition: all 0.3s;
}

.button:hover {
    background: #5a6a7b;
}
</style>

</head>
<body>

<div class="wrapper">
    <a href="https://kokyujene.github.io/tool/study/" target="_blank" class="button">
        <b>勉強を開始する</b>
    </a>
</div>

</body>
</html>
