<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勉強時間管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.light {
            background-color: #f5f5f0;
            color: #3a3a3a;
        }

        body.dark {
            background-color: #2a2d3a;
            color: #e8e8e8;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .menu {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .menu button {
            padding: 10px 25px;
            font-size: 0.95rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .light .menu button {
            background-color: #e0e0da;
            color: #3a3a3a;
        }

        .light .menu button.active {
            background-color: #6b7b8c;
            color: white;
        }

        .dark .menu button {
            background-color: #3a3d4a;
            color: #e8e8e8;
        }

        .dark .menu button.active {
            background-color: #5a6b7c;
            color: white;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .timer {
            font-size: 4rem;
            font-weight: 300;
            margin: 40px 0;
            font-variant-numeric: tabular-nums;
        }

        .session-info {
            font-size: 0.95rem;
            margin: 30px 0;
            opacity: 0.7;
            line-height: 1.8;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 40px;
        }

        button {
            padding: 15px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .light button.primary {
            background-color: #6b7b8c;
            color: white;
        }

        .light button.primary:hover {
            background-color: #5a6a7b;
        }

        .dark button.primary {
            background-color: #5a6b7c;
            color: white;
        }

        .dark button.primary:hover {
            background-color: #4a5b6c;
        }

        .light button.secondary {
            background-color: #d4d4ce;
            color: #3a3a3a;
        }

        .light button.secondary:hover {
            background-color: #c4c4be;
        }

        .dark button.secondary {
            background-color: #3a3d4a;
            color: #e8e8e8;
        }

        .dark button.secondary:hover {
            background-color: #4a4d5a;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            padding: 10px;
        }

        .light .theme-toggle {
            background-color: #e0e0da;
        }

        .dark .theme-toggle {
            background-color: #3a3d4a;
        }

        .theme-toggle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        button:active {
            transform: scale(0.98);
        }

        .hidden {
            display: none;
        }

        .history-list {
            max-height: 500px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .history-item {
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-align: left;
            position: relative;
            transition: all 0.2s;
        }

        .history-item.selected {
            border: 2px solid;
        }

        .light .history-item.selected {
            border-color: #6b7b8c;
            background-color: #d8d8d2;
        }

        .dark .history-item.selected {
            border-color: #7a8b9c;
            background-color: #4a4d5a;
        }

        .history-item-checkbox {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .light .history-item {
            background-color: #e8e8e2;
        }

        .dark .history-item {
            background-color: #3a3d4a;
        }

        .history-item-date {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .history-item-time {
            font-size: 0.95rem;
            opacity: 0.8;
            line-height: 1.6;
        }

        .history-item-duration {
            font-size: 1.2rem;
            margin-top: 10px;
            font-weight: 500;
        }

        .light .history-item-duration {
            color: #6b7b8c;
        }

        .dark .history-item-duration {
            color: #7a8b9c;
        }

        .empty-state {
            margin-top: 60px;
            opacity: 0.5;
            font-size: 1rem;
        }

        .clear-history {
            margin-top: 30px;
        }

        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .light .search-box input {
            background-color: #e8e8e2;
            color: #3a3a3a;
        }

        .dark .search-box input {
            background-color: #3a3d4a;
            color: #e8e8e8;
        }

        .light .search-box input::placeholder {
            color: #8a8a8a;
        }

        .dark .search-box input::placeholder {
            color: #a8a8a8;
        }

        .search-box input:focus {
            outline: none;
        }

        .light .search-box input:focus {
            background-color: #deded8;
        }

        .dark .search-box input:focus {
            background-color: #4a4d5a;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .light .stat-card {
            background-color: #e8e8e2;
        }

        .dark .stat-card {
            background-color: #3a3d4a;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .light .stat-value {
            color: #6b7b8c;
        }

        .dark .stat-value {
            color: #7a8b9c;
        }

        .group-selector {
            margin-bottom: 20px;
        }

        .group-selector select {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
        }

        .light .group-selector select {
            background-color: #e8e8e2;
            color: #3a3a3a;
        }

        .dark .group-selector select {
            background-color: #3a3d4a;
            color: #e8e8e8;
        }

        .group-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .group-input input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .light .group-input input {
            background-color: #e8e8e2;
            color: #3a3a3a;
        }

        .dark .group-input input {
            background-color: #3a3d4a;
            color: #e8e8e8;
        }

        .group-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-top: 8px;
            font-weight: 500;
        }

        .light .group-badge {
            background-color: #6b7b8c;
            color: white;
        }

        .dark .group-badge {
            background-color: #5a6b7c;
            color: white;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .action-buttons button {
            padding: 10px 20px;
            font-size: 0.9rem;
        }

        .action-buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .move-group-container {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            gap: 12px;
            align-items: center;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
        }

        .light .move-group-container {
            background-color: #f5f5f0;
            border-top: 1px solid #e0e0da;
        }

        .dark .move-group-container {
            background-color: #2a2d3a;
            border-top: 1px solid #3a3d4a;
        }

        .move-group-container.active {
            display: flex;
        }

        .move-group-container input {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .light .move-group-container input {
            background-color: #e8e8e2;
            color: #3a3a3a;
        }

        .dark .move-group-container input {
            background-color: #3a3d4a;
            color: #e8e8e8;
        }

        .light .move-group-container input:focus {
            outline: none;
            background-color: #deded8;
            box-shadow: 0 0 0 3px rgba(107, 123, 140, 0.1);
        }

        .dark .move-group-container input:focus {
            outline: none;
            background-color: #4a4d5a;
            box-shadow: 0 0 0 3px rgba(122, 139, 156, 0.1);
        }

        .light .move-group-container input::placeholder {
            color: #9a9a9a;
        }

        .dark .move-group-container input::placeholder {
            color: #8a8a8a;
        }

        .move-group-container button {
            padding: 14px 24px;
            white-space: nowrap;
            border-radius: 10px;
        }

        .modal {
            display: none;
        }

        @media (min-width: 769px) {
            .move-group-container {
                position: static;
                box-shadow: none;
                border: none;
                padding: 0;
                margin-bottom: 24px;
            }

            .light .move-group-container {
                background-color: transparent;
                border: none;
            }

            .dark .move-group-container {
                background-color: transparent;
                border: none;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                max-width: 100%;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }

            .timer {
                font-size: 3rem;
                margin: 30px 0;
            }

            .theme-toggle {
                top: 15px;
                right: 15px;
                width: 45px;
                height: 45px;
            }

            .menu button {
                padding: 8px 20px;
                font-size: 0.9rem;
            }

            button {
                padding: 12px 25px;
                font-size: 0.95rem;
            }

            .history-item {
                padding: 15px;
            }

            .move-group-container {
                flex-direction: column;
                align-items: stretch;
                padding: 20px;
                gap: 12px;
            }

            .move-group-container input {
                min-width: 100%;
            }

            .move-group-container button {
                width: 100%;
            }

            .move-group-buttons {
                display: flex;
                gap: 12px;
            }

            .move-group-buttons button {
                flex: 1;
            }

            .move-group-container.active ~ .history-list {
                padding-bottom: 180px;
            }
        }

        @media (max-width: 480px) {
            .timer {
                font-size: 2.5rem;
            }

            .session-info {
                font-size: 0.9rem;
            }

            .history-item-date {
                font-size: 1rem;
            }

            .history-item-time {
                font-size: 0.85rem;
            }

            .history-item-duration {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body class="light">
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="テーマ切り替え">
        <img id="themeIcon" src="moon.webp" alt="テーマ切り替え">
    </button>
    
    <div class="container">
        <h1>勉強時間管理</h1>
        
        <div class="menu">
            <button class="active" onclick="showPage('timer')">タイマー</button>
            <button onclick="showPage('stats')">統計</button>
            <button onclick="showPage('list')">リスト</button>
        </div>

        <!-- タイマーページ -->
        <div id="timerPage" class="page active">
            <div class="timer" id="timer">00:00:00</div>
            
            <div class="group-input">
                <input type="text" id="groupInput" placeholder="グループ名(任意)">
            </div>
            
            <div class="session-info" id="sessionInfo">
                開始ボタンを押して学習を始めましょう
            </div>
            
            <div class="controls">
                <button id="startBtn" class="primary" onclick="startStudy()">勉強開始</button>
                <button id="pauseBtn" class="secondary hidden" onclick="pauseStudy()">一時停止</button>
                <button id="endBtn" class="secondary hidden" onclick="endStudy()">終了</button>
            </div>
        </div>

        <!-- 統計ページ -->
        <div id="statsPage" class="page">
            <div class="stats-container" id="statsContainer"></div>
            <div class="group-selector" id="groupStatsSelector"></div>
            <div id="groupStats"></div>
        </div>

        <!-- リストページ -->
        <div id="listPage" class="page">
            <div class="group-selector">
                <select id="groupFilter" onchange="loadHistory()">
                    <option value="">すべてのグループ</option>
                </select>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="日付や時刻で検索(例: 2025年12月11日や、14:30)" oninput="loadHistory()">
            </div>
            <div class="action-buttons">
                <button class="secondary" onclick="toggleSelectAll()">すべて選択</button>
                <button class="secondary" id="deleteBtn" onclick="deleteSelected()" disabled>選択を削除</button>
            </div>
            <div class="move-group-container" id="moveGroupContainer">
                <input type="text" id="moveGroupInput" placeholder="移動先のグループ名を入力">
                <div class="move-group-buttons">
                    <button class="secondary" onclick="hideMoveGroup()">キャンセル</button>
                    <button class="primary" onclick="moveSelectedToGroup()">移動</button>
                </div>
            </div>
            <div id="historyList" class="history-list"></div>
            <button class="secondary clear-history" onclick="clearHistory()">すべての履歴をクリア</button>
        </div>
    </div>

    <script>
        let startTime = null;
        let pausedTime = 0;
        let timerInterval = null;
        let isPaused = false;
        let selectedItems = new Set();
        let allHistoryItems = [];

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function setCookie(name, value, days = 365) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${value};expires=${date.toUTCString()};path=/`;
        }

        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            
            if (body.classList.contains('light')) {
                body.classList.remove('light');
                body.classList.add('dark');
                themeIcon.src = 'sun.webp';
                themeIcon.alt = 'ライトモードに切り替え';
                setCookie('theme', 'dark');
            } else {
                body.classList.remove('dark');
                body.classList.add('light');
                themeIcon.src = 'moon.webp';
                themeIcon.alt = 'ダークモードに切り替え';
                setCookie('theme', 'light');
            }
        }

        function showPage(pageName) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.menu button').forEach(btn => btn.classList.remove('active'));
            
            if (pageName === 'timer') {
                document.getElementById('timerPage').classList.add('active');
                document.querySelector('.menu button:nth-child(1)').classList.add('active');
            } else if (pageName === 'stats') {
                document.getElementById('statsPage').classList.add('active');
                document.querySelector('.menu button:nth-child(2)').classList.add('active');
                loadStats();
            } else if (pageName === 'list') {
                document.getElementById('listPage').classList.add('active');
                document.querySelector('.menu button:nth-child(3)').classList.add('active');
                updateGroupFilter();
                loadHistory();
            }
        }

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function formatDateTime(date) {
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}年${month}月${day}日`;
        }

        function updateTimer() {
            if (!isPaused && startTime) {
                const elapsed = Date.now() - startTime + pausedTime;
                document.getElementById('timer').textContent = formatTime(elapsed);
            }
        }

        function startStudy() {
            startTime = Date.now();
            pausedTime = 0;
            isPaused = false;
            
            const startTimeStr = new Date().toISOString();
            setCookie('studyStartTime', startTimeStr);
            
            document.getElementById('startBtn').classList.add('hidden');
            document.getElementById('pauseBtn').classList.remove('hidden');
            document.getElementById('endBtn').classList.remove('hidden');
            
            document.getElementById('sessionInfo').textContent = 
                `開始時刻: ${formatDateTime(new Date())}`;
            
            timerInterval = setInterval(updateTimer, 100);
        }

        function pauseStudy() {
            if (isPaused) {
                startTime = Date.now();
                isPaused = false;
                document.getElementById('pauseBtn').textContent = '一時停止';
            } else {
                pausedTime += Date.now() - startTime;
                isPaused = true;
                document.getElementById('pauseBtn').textContent = '再開';
            }
        }

        function endStudy() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            const endTime = new Date();
            const startCookie = getCookie('studyStartTime');
            const groupInput = document.getElementById('groupInput');
            const groupName = groupInput.value.trim() || '';
            
            if (startCookie) {
                const start = new Date(startCookie);
                const actualStudyTime = isPaused ? pausedTime : (Date.now() - startTime + pausedTime);
                
                let history = getCookie('studyHistory');
                history = history ? JSON.parse(history) : [];
                history.unshift({
                    start: start.toISOString(),
                    end: endTime.toISOString(),
                    duration: actualStudyTime,
                    group: groupName
                });
                setCookie('studyHistory', JSON.stringify(history));
                
                document.getElementById('sessionInfo').innerHTML = 
                    `開始時刻: ${formatDateTime(start)}<br>終了時刻: ${formatDateTime(endTime)}<br>学習時間: ${formatTime(actualStudyTime)}${groupName ? '<br>グループ: ' + groupName : ''}`;
            }
            
            document.getElementById('startBtn').classList.remove('hidden');
            document.getElementById('pauseBtn').classList.add('hidden');
            document.getElementById('endBtn').classList.add('hidden');
            document.getElementById('pauseBtn').textContent = '一時停止';
            groupInput.value = '';
            
            startTime = null;
            pausedTime = 0;
            isPaused = false;
        }

        function loadHistory() {
            const historyList = document.getElementById('historyList');
            const searchInput = document.getElementById('searchInput');
            const groupFilter = document.getElementById('groupFilter');
            const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
            const selectedGroup = groupFilter ? groupFilter.value : '';
            
            let history = getCookie('studyHistory');
            history = history ? JSON.parse(history) : [];
            allHistoryItems = [...history];
            
            if (selectedGroup) {
                history = history.filter(item => item.group === selectedGroup);
            }
            
            if (searchTerm) {
                history = history.filter(item => {
                    const start = new Date(item.start);
                    const end = new Date(item.end);
                    const dateStr = formatDate(start).toLowerCase();
                    const startTimeStr = formatDateTime(start).toLowerCase();
                    const endTimeStr = formatDateTime(end).toLowerCase();
                    
                    return dateStr.includes(searchTerm) || 
                           startTimeStr.includes(searchTerm) || 
                           endTimeStr.includes(searchTerm);
                });
            }
            
            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-state">学習記録がありません</div>';
                updateActionButtons();
                return;
            }
            
            historyList.innerHTML = history.map((item, index) => {
                const actualIndex = allHistoryItems.findIndex(h => 
                    h.start === item.start && h.end === item.end && h.duration === item.duration
                );
                const start = new Date(item.start);
                const end = new Date(item.end);
                const groupBadge = item.group ? `<div class="group-badge">${item.group}</div>` : '';
                const isSelected = selectedItems.has(actualIndex);
                return `
                    <div class="history-item ${isSelected ? 'selected' : ''}" onclick="toggleSelection(event, ${actualIndex})">
                        <input type="checkbox" class="history-item-checkbox" ${isSelected ? 'checked' : ''} onclick="toggleSelection(event, ${actualIndex})">
                        <div class="history-item-date">${formatDate(start)}</div>
                        <div class="history-item-time">
                            開始: ${formatDateTime(start)}<br>
                            終了: ${formatDateTime(end)}
                        </div>
                        <div class="history-item-duration">学習時間: ${formatTime(item.duration)}</div>
                        ${groupBadge}
                    </div>
                `;
            }).join('');
            
            updateActionButtons();
        }

        function toggleSelection(event, index) {
            event.stopPropagation();
            if (selectedItems.has(index)) {
                selectedItems.delete(index);
            } else {
                selectedItems.add(index);
            }
            loadHistory();
        }

        function toggleSelectAll() {
            const searchInput = document.getElementById('searchInput');
            const groupFilter = document.getElementById('groupFilter');
            const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
            const selectedGroup = groupFilter ? groupFilter.value : '';
            
            let history = [...allHistoryItems];
            
            if (selectedGroup) {
                history = history.filter(item => item.group === selectedGroup);
            }
            
            if (searchTerm) {
                history = history.filter(item => {
                    const start = new Date(item.start);
                    const end = new Date(item.end);
                    const dateStr = formatDate(start).toLowerCase();
                    const startTimeStr = formatDateTime(start).toLowerCase();
                    const endTimeStr = formatDateTime(end).toLowerCase();
                    
                    return dateStr.includes(searchTerm) || 
                           startTimeStr.includes(searchTerm) || 
                           endTimeStr.includes(searchTerm);
                });
            }
            
            const visibleIndices = history.map(item => 
                allHistoryItems.findIndex(h => 
                    h.start === item.start && h.end === item.end && h.duration === item.duration
                )
            );
            
            const allSelected = visibleIndices.every(i => selectedItems.has(i));
            
            if (allSelected) {
                visibleIndices.forEach(i => selectedItems.delete(i));
            } else {
                visibleIndices.forEach(i => selectedItems.add(i));
            }
            
            loadHistory();
        }

        function updateActionButtons() {
            const moveContainer = document.getElementById('moveGroupContainer');
            const deleteBtn = document.getElementById('deleteBtn');
            const hasSelection = selectedItems.size > 0;
            
            if (moveContainer) {
                if (hasSelection) {
                    moveContainer.classList.add('active');
                } else {
                    moveContainer.classList.remove('active');
                }
            }
            if (deleteBtn) deleteBtn.disabled = !hasSelection;
        }

        function deleteSelected() {
            if (selectedItems.size === 0) return;
            
            if (confirm(`選択した${selectedItems.size}件の記録を削除しますか?`)) {
                let history = getCookie('studyHistory');
                history = history ? JSON.parse(history) : [];
const indicesToDelete = Array.from(selectedItems).sort((a, b) => b - a);
            indicesToDelete.forEach(index => {
                history.splice(index, 1);
            });
            
            setCookie('studyHistory', JSON.stringify(history));
            selectedItems.clear();
            updateGroupFilter();
            loadHistory();
        }
    }

    function showMoveModal() {
        // 削除(使用しない)
    }

    function closeMoveModal() {
        // 削除(使用しない)
    }

    function hideMoveGroup() {
        selectedItems.clear();
        document.getElementById('moveGroupInput').value = '';
        loadHistory();
    }

    function moveSelectedToGroup() {
        const newGroup = document.getElementById('moveGroupInput').value.trim();
        
        if (selectedItems.size === 0) {
            return;
        }
        
        let history = getCookie('studyHistory');
        history = history ? JSON.parse(history) : [];
        
        Array.from(selectedItems).forEach(index => {
            if (history[index]) {
                history[index].group = newGroup;
            }
        });
        
        setCookie('studyHistory', JSON.stringify(history));
        selectedItems.clear();
        document.getElementById('moveGroupInput').value = '';
        updateGroupFilter();
        loadHistory();
    }

    function updateGroupFilter() {
        let history = getCookie('studyHistory');
        history = history ? JSON.parse(history) : [];
        
        const groups = [...new Set(history.map(item => item.group).filter(g => g))];
        const groupFilter = document.getElementById('groupFilter');
        
        groupFilter.innerHTML = '<option value="">すべてのグループ</option>';
        groups.forEach(group => {
            groupFilter.innerHTML += `<option value="${group}">${group}</option>`;
        });
    }

    function calculateStreak() {
        let history = getCookie('studyHistory');
        history = history ? JSON.parse(history) : [];
        
        if (history.length === 0) return 0;
        
        const dates = [...new Set(history.map(item => {
            const date = new Date(item.start);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }))].sort().reverse();
        
        let streak = 0;
        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        
        for (let i = 0; i < dates.length; i++) {
            const expectedDate = new Date(today);
            expectedDate.setDate(today.getDate() - i);
            const expectedStr = `${expectedDate.getFullYear()}-${String(expectedDate.getMonth() + 1).padStart(2, '0')}-${String(expectedDate.getDate()).padStart(2, '0')}`;
            
            if (dates[i] === expectedStr) {
                streak++;
            } else {
                break;
            }
        }
        
        return streak;
    }

    function loadStats() {
        let history = getCookie('studyHistory');
        history = history ? JSON.parse(history) : [];
        
        const totalTime = history.reduce((sum, item) => sum + item.duration, 0);
        const streak = calculateStreak();
        const totalSessions = history.length;
        
        const statsContainer = document.getElementById('statsContainer');
        statsContainer.innerHTML = `
            <div class="stat-card">
                <div class="stat-label">トータル勉強時間</div>
                <div class="stat-value">${formatTime(totalTime)}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">連続日数</div>
                <div class="stat-value">${streak}日</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">総セッション数</div>
                <div class="stat-value">${totalSessions}</div>
            </div>
        `;
        
        const groups = {};
        history.forEach(item => {
            const group = item.group || '未分類';
            if (!groups[group]) {
                groups[group] = 0;
            }
            groups[group] += item.duration;
        });
        
        const groupStatsSelector = document.getElementById('groupStatsSelector');
        const groupStats = document.getElementById('groupStats');
        
        if (Object.keys(groups).length > 0) {
            groupStatsSelector.innerHTML = '<h2 style="font-size: 1.2rem; margin-bottom: 15px; font-weight: 500;">グループ別統計</h2>';
            groupStats.innerHTML = Object.entries(groups)
                .sort((a, b) => b[1] - a[1])
                .map(([group, duration]) => `
                    <div class="stat-card" style="margin-bottom: 15px;">
                        <div class="stat-label">${group}</div>
                        <div class="stat-value">${formatTime(duration)}</div>
                    </div>
                `).join('');
        }
    }

    function clearHistory() {
        if (confirm('すべての学習記録を削除しますか?')) {
            setCookie('studyHistory', JSON.stringify([]));
            selectedItems.clear();
            loadHistory();
        }
    }

    // 初期化
    window.onload = function() {
        const theme = getCookie('theme');
        const themeIcon = document.getElementById('themeIcon');
        
        if (theme === 'dark') {
            document.body.classList.remove('light');
            document.body.classList.add('dark');
            themeIcon.src = 'sun.webp';
            themeIcon.alt = 'ライトモードに切り替え';
        }
        
        let history = getCookie('studyHistory');
        history = history ? JSON.parse(history) : [];
        if (history.length > 0) {
            const last = history[0];
            const start = new Date(last.start);
            const end = new Date(last.end);
            document.getElementById('sessionInfo').innerHTML = 
                `前回の学習<br>開始: ${formatDateTime(start)} / 終了: ${formatDateTime(end)}<br>学習時間: ${formatTime(last.duration)}`;
        }
    };
</script>
</body>
