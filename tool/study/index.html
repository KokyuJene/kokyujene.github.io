<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勉強時間管理</title>
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="shortcut icon" type="image/webp" href="favicon.webp">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.light {
            background-color: var(--bg-light);
            color: #3a3a3a;
        }

        body.dark {
            background-color: var(--bg-dark);
            color: #e8e8e8;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .menu {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .menu button {
            padding: 10px 25px;
            font-size: 0.95rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .light .menu button {
            background-color: #e0e0da;
            color: #3a3a3a;
        }

        .light .menu button.active {
            background-color: var(--primary-color);
            color: white;
        }

        .dark .menu button {
            background-color: #3a3d4a;
            color: #e8e8e8;
        }

        .dark .menu button.active {
            background-color: var(--primary-color-dark);
            color: white;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .timer {
            font-size: 4rem;
            font-weight: 300;
            margin: 40px 0;
            font-variant-numeric: tabular-nums;
        }

        .session-info {
            font-size: 0.95rem;
            margin: 30px 0;
            opacity: 0.7;
            line-height: 1.8;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 40px;
        }

        button {
            padding: 15px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .light button.primary {
            background-color: var(--primary-color);
            color: white;
        }

        .light button.primary:hover {
            background-color: var(--primary-hover);
        }

        .dark button.primary {
            background-color: var(--primary-color-dark);
            color: white;
        }

        .dark button.primary:hover {
            background-color: var(--primary-hover-dark);
        }

        .light button.secondary {
            background-color: #d4d4ce;
            color: #3a3a3a;
        }

        .light button.secondary:hover {
            background-color: #c4c4be;
        }

        .dark button.secondary {
            background-color: #3a3d4a;
            color: #e8e8e8;
        }

        .dark button.secondary:hover {
            background-color: #4a4d5a;
        }

        .top-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .theme-toggle, .settings-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            padding: 10px;
        }

        .light .theme-toggle, .light .settings-btn {
            background-color: #e0e0da;
        }

        .dark .theme-toggle, .dark .settings-btn {
            background-color: #3a3d4a;
        }

        .theme-toggle img, .settings-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        button:active {
            transform: scale(0.98);
        }

        .hidden {
            display: none;
        }

        .history-list {
            max-height: 500px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .history-item {
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-align: left;
            position: relative;
            transition: all 0.2s;
        }

        .history-item.selected {
            border: 2px solid;
        }

        .light .history-item.selected {
            border-color: var(--primary-color);
            background-color: #d8d8d2;
        }

        .dark .history-item.selected {
            border-color: var(--primary-color-dark);
            background-color: #4a4d5a;
        }

        .history-item-checkbox {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .light .history-item {
            background-color: #e8e8e2;
        }

        .dark .history-item {
            background-color: #3a3d4a;
        }

        .history-item-date {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .history-item-time {
            font-size: 0.95rem;
            opacity: 0.8;
            line-height: 1.6;
        }

        .history-item-duration {
            font-size: 1.2rem;
            margin-top: 10px;
            font-weight: 500;
        }

        .light .history-item-duration {
            color: var(--primary-color);
        }

        .dark .history-item-duration {
            color: var(--primary-color-dark);
        }

        .empty-state {
            margin-top: 60px;
            opacity: 0.5;
            font-size: 1rem;
        }

        .clear-history {
            margin-top: 30px;
        }

        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .light .search-box input {
            background-color: #e8e8e2;
            color: #3a3a3a;
        }

        .dark .search-box input {
            background-color: #3a3d4a;
            color: #e8e8e8;
        }

        .light .search-box input::placeholder {
            color: #8a8a8a;
        }

        .dark .search-box input::placeholder {
            color: #a8a8a8;
        }

        .search-box input:focus {
            outline: none;
        }

        .light .search-box input:focus {
            background-color: #deded8;
        }

        .dark .search-box input:focus {
            background-color: #4a4d5a;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .light .stat-card {
            background-color: #e8e8e2;
        }

        .dark .stat-card {
            background-color: #3a3d4a;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .light .stat-value {
            color: var(--primary-color);
        }

        .dark .stat-value {
            color: var(--primary-color-dark);
        }

        .group-selector {
            margin-bottom: 20px;
        }

        .group-selector select {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
        }

        .light .group-selector select {
            background-color: #e8e8e2;
            color: #3a3a3a;
        }

        .dark .group-selector select {
            background-color: #3a3d4a;
            color: #e8e8e8;
        }

        .group-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .group-input input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .light .group-input input {
            background-color: #e8e8e2;
            color: #3a3a3a;
        }

        .dark .group-input input {
            background-color: #3a3d4a;
            color: #e8e8e8;
        }

        .group-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-top: 8px;
            font-weight: 500;
        }

        .light .group-badge {
            background-color: var(--primary-color);
            color: white;
        }

        .dark .group-badge {
            background-color: var(--primary-color-dark);
            color: white;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .action-buttons button {
            padding: 10px 20px;
            font-size: 0.9rem;
        }

        .action-buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .move-group-container {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            gap: 12px;
            align-items: center;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.15);
        }

        .light .move-group-container {
            background-color: var(--bg-light);
            border-top: 1px solid #e0e0da;
        }

        .dark .move-group-container {
            background-color: var(--bg-dark);
            border-top: 1px solid #3a3d4a;
        }

        .move-group-container.active {
            display: flex;
        }

        .move-group-container input {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .light .move-group-container input {
            background-color: #e8e8e2;
            color: #3a3a3a;
        }

        .dark .move-group-container input {
            background-color: #3a3d4a;
            color: #e8e8e8;
        }

        .light .move-group-container input:focus {
            outline: none;
            background-color: #deded8;
            box-shadow: 0 0 0 3px rgba(107, 123, 140, 0.1);
        }

        .dark .move-group-container input:focus {
            outline: none;
            background-color: #4a4d5a;
            box-shadow: 0 0 0 3px rgba(122, 139, 156, 0.1);
        }

        .light .move-group-container input::placeholder {
            color: #9a9a9a;
        }

        .dark .move-group-container input::placeholder {
            color: #8a8a8a;
        }

        .move-group-container button {
            padding: 14px 24px;
            white-space: nowrap;
            border-radius: 10px;
        }

        .modal {
            display: none;
        }

        .theme-selector {
            margin-bottom: 30px;
        }

        .theme-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .theme-option {
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 3px solid transparent;
            text-align: center;
        }

        .theme-option:hover {
            transform: scale(1.05);
        }

        .theme-option.selected {
            border-color: #000;
        }

        .dark .theme-option.selected {
            border-color: #fff;
        }

        .theme-option-name {
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .theme-option-preview {
            width: 100%;
            height: 40px;
            border-radius: 6px;
            display: flex;
            gap: 3px;
            padding: 5px;
        }

        .theme-option-preview div {
            flex: 1;
            border-radius: 3px;
        }

        .copyright {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid;
            font-size: 0.85rem;
            opacity: 0.5;
        }

        .light .copyright {
            border-color: #d0d0ca;
        }

        .dark .copyright {
            border-color: #4a4d5a;
        }

        .settings-section {
            margin-bottom: 30px;
            text-align: left;
        }

        .settings-section h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .toggle-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .light .toggle-item {
            background-color: #e8e8e2;
        }

        .dark .toggle-item {
            background-color: #3a3d4a;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            background-color: #ccc;
            border-radius: 13px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .toggle-switch.active {
            background-color: var(--primary-color);
        }

        .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active .toggle-slider {
            transform: translateX(24px);
        }

        .music-player {
            margin-bottom: 30px;
            text-align: left;
        }

        .music-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .music-controls input[type="file"] {
            display: none;
        }

        .music-controls label {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .light .music-controls label {
            background-color: #e8e8e2;
            color: #3a3a3a;
        }

        .dark .music-controls label {
            background-color: #3a3d4a;
            color: #e8e8e8;
        }

        .music-controls label:hover {
            opacity: 0.8;
        }

        .music-controls button {
            padding: 12px 20px;
            font-size: 0.9rem;
        }

        .player-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .player-controls button {
            padding: 10px 20px;
            font-size: 0.9rem;
        }

        .player-controls .control-icon {
            font-size: 1.2rem;
        }

        .playlist {
            max-height: 300px;
            overflow-y: auto;
        }

        .playlist-item {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            gap: 10px;
        }

        .light .playlist-item {
            background-color: #e8e8e2;
        }

        .dark .playlist-item {
            background-color: #3a3d4a;
        }

        .playlist-item:hover {
            opacity: 0.8;
        }

        .playlist-item.playing {
            border: 2px solid var(--primary-color);
        }

        .playlist-item-info {
            flex: 1;
            min-width: 0;
        }

        .playlist-item-title {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item-buttons {
            display: flex;
            gap: 5px;
        }

        .playlist-item button {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .todo-list {
            text-align: left;
        }

        .todo-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .todo-input input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .light .todo-input input {
            background-color: #e8e8e2;
            color: #3a3a3a;
        }

        .dark .todo-input input {
            background-color: #3a3d4a;
            color: #e8e8e8;
        }

        .todo-items {
            max-height: 400px;
            overflow-y: auto;
        }

        .todo-item {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .light .todo-item {
            background-color: #e8e8e2;
        }

        .dark .todo-item {
            background-color: #3a3d4a;
        }

        .todo-item.completed {
            opacity: 0.5;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .todo-text {
            flex: 1;
            word-break: break-word;
        }

        .todo-delete {
            padding: 6px 12px;
            font-size: 0.8rem;
            background-color: #d66;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .todo-delete:hover {
            background-color: #c55;
        }

        @media (min-width: 769px) {
            .move-group-container {
                position: static;
                box-shadow: none;
                border: none;
                padding: 0;
                margin-bottom: 24px;
            }

            .light .move-group-container {
                background-color: transparent;
                border: none;
            }

            .dark .move-group-container {
                background-color: transparent;
                border: none;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                max-width: 100%;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }

            .timer {
                font-size: 3rem;
                margin: 30px 0;
            }

            .top-buttons {
                top: 15px;
                right: 15px;
            }

            .theme-toggle, .settings-btn {
                width: 45px;
                height: 45px;
            }

            .menu button {
                padding: 8px 20px;
                font-size: 0.9rem;
            }

            button {
                padding: 12px 25px;
                font-size: 0.95rem;
            }

            .history-item {
                padding: 15px;
            }

            .move-group-container {
                flex-direction: column;
                align-items: stretch;
                padding: 20px;
                gap: 12px;
            }

            .move-group-container input {
                min-width: 100%;
            }

            .move-group-container button {
                width: 100%;
            }

            .move-group-buttons {
                display: flex;
                gap: 12px;
            }

            .move-group-buttons button {
                flex: 1;
            }

            .move-group-container.active ~ .history-list {
                padding-bottom: 180px;
            }

            .theme-options {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .timer {
                font-size: 2.5rem;
            }

            .session-info {
                font-size: 0.9rem;
            }

            .history-item-date {
                font-size: 1rem;
            }

            .history-item-time {
                font-size: 0.85rem;
            }

            .history-item-duration {
                font-size: 1.1rem;
            }
        }

        :root {
            --primary-color: #6b7b8c;
            --primary-hover: #5a6a7b;
            --primary-color-dark: #5a6b7c;
            --primary-hover-dark: #4a5b6c;
            --bg-light: #f5f5f0;
            --bg-dark: #2a2d3a;
        }

        body[data-theme="green"] {
            --primary-color: #6b8c6b;
            --primary-hover: #5a7b5a;
            --primary-color-dark: #5a7c5a;
            --primary-hover-dark: #4a6c4a;
            --bg-light: #f0f5f0;
            --bg-dark: #2a3a2d;
        }

        body[data-theme="purple"] {
            --primary-color: #7b6b8c;
            --primary-hover: #6a5a7b;
            --primary-color-dark: #6b5a7c;
            --primary-hover-dark: #5b4a6c;
            --bg-light: #f5f0f5;
            --bg-dark: #2d2a3a;
        }

        body[data-theme="orange"] {
            --primary-color: #c97c5d;
            --primary-hover: #b86c4d;
            --primary-color-dark: #b86c4d;
            --primary-hover-dark: #a85c3d;
            --bg-light: #f5f2f0;
            --bg-dark: #3a2e2a;
        }

        body[data-theme="pink"] {
            --primary-color: #c77d88;
            --primary-hover: #b66d78;
            --primary-color-dark: #b66d78;
            --primary-hover-dark: #a65d68;
            --bg-light: #f5f0f2;
            --bg-dark: #3a2a2d;
        }

        body[data-theme="teal"] {
            --primary-color: #5d9d9d;
            --primary-hover: #4d8d8d;
            --primary-color-dark: #4d8d8d;
            --primary-hover-dark: #3d7d7d;
            --bg-light: #f0f5f5;
            --bg-dark: #2a3a3a;
        }
    </style>
</head>
<body class="light" data-theme="blue">
    <div class="top-buttons">
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="テーマ切り替え">
            <img id="themeIcon" src="moon.webp" alt="テーマ切り替え">
        </button>
        <button class="settings-btn" onclick="showPage('settings')" aria-label="設定">
            <img src="settings.webp" alt="設定">
        </button>
    </div>
    
    <div class="container">
        <h1>勉強時間管理</h1>
        
        <div class="menu" id="mainMenu">
            <button class="active" onclick="showPage('timer')">タイマー</button>
            <button onclick="showPage('stats')">統計</button>
            <button onclick="showPage('list')">リスト</button>
        </div>

        <div id="timerPage" class="page active">
            <div class="timer" id="timer">00:00:00</div>
            <div class="group-input">
                <input type="text" id="groupInput" placeholder="グループ名(任意)">

<script>
    let startTime = null;
    let pausedTime = 0;
    let timerInterval = null;
    let isPaused = false;
    let selectedItems = new Set();
    let allHistoryItems = [];
    let currentMusicIndex = -1;
    let musicFiles = [];
    let isLoop = false;
    let isShuffle = false;
    // IndexedDB for persistent storage of uploaded music files
    let _musicDB = null;
    function openMusicDB() {
        return new Promise((resolve, reject) => {
            if (_musicDB) return resolve(_musicDB);
            const req = indexedDB.open('study_music_db', 1);
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('files')) {
                    db.createObjectStore('files', { keyPath: 'id' });
                }
            };
            req.onsuccess = (e) => {
                _musicDB = e.target.result;
                resolve(_musicDB);
            };
            req.onerror = (e) => reject(e);
        });
    }

    async function saveFileBlobToDB(id, title, file) {
        const db = await openMusicDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction('files', 'readwrite');
            const store = tx.objectStore('files');
            const req = store.put({ id: id, title: title, blob: file });
            req.onsuccess = () => resolve();
            req.onerror = (e) => reject(e);
        });
    }

    async function getFileBlobFromDB(id) {
        const db = await openMusicDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction('files', 'readonly');
            const store = tx.objectStore('files');
            const req = store.get(id);
            req.onsuccess = () => {
                if (req.result) resolve(req.result.blob);
                else resolve(null);
            };
            req.onerror = (e) => reject(e);
        });
    }

    async function deleteFileBlobFromDB(id) {
        const db = await openMusicDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction('files', 'readwrite');
            const store = tx.objectStore('files');
            const req = store.delete(id);
            req.onsuccess = () => resolve();
            req.onerror = (e) => reject(e);
        });
    }

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    function setCookie(name, value, days = 365) {
        const date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        document.cookie = `${name}=${value};expires=${date.toUTCString()};path=/`;
    }

    function toggleTheme() {
        const body = document.body;
        const themeIcon = document.getElementById('themeIcon');
        if (body.classList.contains('light')) {
            body.classList.remove('light');
            body.classList.add('dark');
            themeIcon.src = 'sun.webp';
            themeIcon.alt = 'ライトモードに切り替え';
            setCookie('mode', 'dark');
        } else {
            body.classList.remove('dark');
            body.classList.add('light');
            themeIcon.src = 'moon.webp';
            themeIcon.alt = 'ダークモードに切り替え';
            setCookie('mode', 'light');
        }
    }

    function changeTheme(themeName) {
        document.body.setAttribute('data-theme', themeName);
        setCookie('theme', themeName);
        document.querySelectorAll('.theme-option').forEach(option => {
            option.classList.remove('selected');
        });
        document.querySelector(`[data-theme="${themeName}"]`).classList.add('selected');
    }

    function toggleFeature(feature) {
        const toggle = document.getElementById(`toggle${feature.charAt(0).toUpperCase() + feature.slice(1)}`);
        const isActive = toggle.classList.contains('active');
        if (isActive) {
            toggle.classList.remove('active');
            removeMenuButton(feature);
            setCookie(`feature_${feature}`, 'false');
        } else {
            toggle.classList.add('active');
            addMenuButton(feature);
            setCookie(`feature_${feature}`, 'true');
        }
    }

    function addMenuButton(feature) {
        const menu = document.getElementById('mainMenu');
        const btnText = feature === 'music' ? '音楽' : 'ToDo';
        const existingBtn = Array.from(menu.children).find(btn => btn.textContent === btnText);
        if (!existingBtn) {
            const btn = document.createElement('button');
            btn.textContent = btnText;
            btn.onclick = () => showPage(feature);
            btn.setAttribute('data-feature', feature);
            menu.appendChild(btn);
        }
    }

    function removeMenuButton(feature) {
        const menu = document.getElementById('mainMenu');
        const btn = menu.querySelector(`[data-feature="${feature}"]`);
        if (btn) btn.remove();
    }

    function showPage(pageName) {
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.querySelectorAll('.menu button').forEach(btn => btn.classList.remove('active'));
        const pages = {'timer': 'timerPage', 'stats': 'statsPage', 'list': 'listPage', 'music': 'musicPage', 'todo': 'todoPage', 'settings': 'settingsPage'};
        if (pages[pageName]) {
            document.getElementById(pages[pageName]).classList.add('active');
            const menuButtons = Array.from(document.querySelectorAll('.menu button'));
            const activeBtn = menuButtons.find(btn => {
                const btnText = btn.textContent;
                return (pageName === 'timer' && btnText === 'タイマー') || (pageName === 'stats' && btnText === '統計') || (pageName === 'list' && btnText === 'リスト') || (pageName === 'music' && btnText === '音楽') || (pageName === 'todo' && btnText === 'ToDo');
            });
            if (activeBtn) activeBtn.classList.add('active');
            if (pageName === 'stats') loadStats();
            if (pageName === 'list') { updateGroupFilter(); loadHistory(); }
            if (pageName === 'music') loadPlaylist();
            if (pageName === 'todo') loadTodos();
        }
    }

    function formatTime(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function formatDateTime(date) {
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        return `${hours}:${minutes}`;
    }

    function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}年${month}月${day}日`;
    }

    function updateTimer() {
        if (!isPaused && startTime) {
            const elapsed = Date.now() - startTime + pausedTime;
            const timeStr = formatTime(elapsed);
            document.getElementById('timer').textContent = timeStr;
            document.title = `${timeStr} - 勉強時間管理`;
        }
    }

    function startStudy() {
        startTime = Date.now();
        pausedTime = 0;
        isPaused = false;
        const startTimeStr = new Date().toISOString();
        setCookie('studyStartTime', startTimeStr);
        document.getElementById('startBtn').classList.add('hidden');
        document.getElementById('pauseBtn').classList.remove('hidden');
        document.getElementById('endBtn').classList.remove('hidden');
        document.getElementById('sessionInfo').textContent = `開始時刻: ${formatDateTime(new Date())}`;
        timerInterval = setInterval(updateTimer, 100);
    }

    function pauseStudy() {
        if (isPaused) {
            startTime = Date.now();
            isPaused = false;
            document.getElementById('pauseBtn').textContent = '一時停止';
        } else {
            pausedTime += Date.now() - startTime;
            isPaused = true;
            document.getElementById('pauseBtn').textContent = '再開';
        }
    }

    function endStudy() {
        if (timerInterval) clearInterval(timerInterval);
        document.title = '勉強時間管理';
        const endTime = new Date();
        const startCookie = getCookie('studyStartTime');
        const groupInput = document.getElementById('groupInput');
        const groupName = groupInput.value.trim() || '';
        if (startCookie) {
            const start = new Date(startCookie);
            const actualStudyTime = isPaused ? pausedTime : (Date.now() - startTime + pausedTime);
            let history = getCookie('studyHistory');
            history = history ? JSON.parse(history) : [];
            history.unshift({start: start.toISOString(), end: endTime.toISOString(), duration: actualStudyTime, group: groupName});
            setCookie('studyHistory', JSON.stringify(history));
            document.getElementById('sessionInfo').innerHTML = `開始時刻: ${formatDateTime(start)}<br>終了時刻: ${formatDateTime(endTime)}<br>学習時間: ${formatTime(actualStudyTime)}${groupName ? '<br>グループ: ' + groupName : ''}`;
        }
        document.getElementById('startBtn').classList.remove('hidden');
        document.getElementById('pauseBtn').classList.add('hidden');
        document.getElementById('endBtn').classList.add('hidden');
        document.getElementById('pauseBtn').textContent = '一時停止';
        groupInput.value = '';
        startTime = null;
        pausedTime = 0;
        isPaused = false;
    }

    async function addMusicFile(event) {
        const files = event.target.files;
        for (let file of files) {
            const id = Date.now() + Math.random();
            try {
                await saveFileBlobToDB(id, file.name, file);
                const blob = await getFileBlobFromDB(id);
                if (blob) {
                    const url = URL.createObjectURL(blob);
                    musicFiles.push({ url: url, title: file.name, id: id });
                } else {
                    // fallback
                    const url = URL.createObjectURL(file);
                    musicFiles.push({ url: url, title: file.name, id: id });
                }
            } catch (e) {
                console.error('Failed to persist file to DB, using in-memory URL', e);
                const url = URL.createObjectURL(file);
                musicFiles.push({ url: url, title: file.name, id: id });
            }
        }
        savePlaylist();
        loadPlaylist();
    }

    function savePlaylist() {
        const playlistData = musicFiles.map(m => ({title: m.title, id: m.id}));
        setCookie('musicPlaylist', JSON.stringify(playlistData));
    }

    function loadPlaylist() {
        const playlistDiv = document.getElementById('playlist');
        if (musicFiles.length === 0) {
            playlistDiv.innerHTML = '<div class="empty-state">ファイルを追加してください</div>';
            return;
        }
        playlistDiv.innerHTML = musicFiles.map((item, index) => `
            <div class="playlist-item ${currentMusicIndex === index ? 'playing' : ''}" onclick="playMusic(${index})">
                <div class="playlist-item-info">
                    <div class="playlist-item-title">${item.title}</div>
                </div>
                <div class="playlist-item-buttons">
                    <button class="secondary" onclick="event.stopPropagation(); renameMusic(${index})">名前変更</button>
                    <button class="secondary" onclick="event.stopPropagation(); deleteMusic(${index})">削除</button>
                </div>
            </div>
        `).join('');
    }

    function playMusic(index) {
        if (musicFiles[index]) {
            const audio = document.getElementById('audioPlayer');
            audio.src = musicFiles[index].url;
            audio.play();
            currentMusicIndex = index;
            const playImg = document.getElementById('playIconImg');
            if (playImg) { playImg.src = 'pause.webp'; playImg.alt = '一時停止'; }
            loadPlaylist();
        }
    }

    function togglePlay() {
        const audio = document.getElementById('audioPlayer');
        if (audio.paused) {
            if (currentMusicIndex === -1 && musicFiles.length > 0) {
                playMusic(0);
            } else {
                audio.play();
                const playImg = document.getElementById('playIconImg');
                if (playImg) { playImg.src = 'pause.webp'; playImg.alt = '一時停止'; }
            }
        } else {
            audio.pause();
            const playImg = document.getElementById('playIconImg');
            if (playImg) { playImg.src = 'play.webp'; playImg.alt = '再生'; }
        }
    }

    function playNext() {
        if (musicFiles.length === 0) return;
        if (isShuffle) {
            if (musicFiles.length === 1) {
                currentMusicIndex = 0;
            } else {
                let nextIndex = currentMusicIndex;
                // pick a different random index when possible
                while (nextIndex === currentMusicIndex) {
                    nextIndex = Math.floor(Math.random() * musicFiles.length);
                }
                currentMusicIndex = nextIndex;
            }
        } else {
            currentMusicIndex = (currentMusicIndex + 1) % musicFiles.length;
        }
        playMusic(currentMusicIndex);
    }

    function playPrevious() {
        if (musicFiles.length === 0) return;
        currentMusicIndex = (currentMusicIndex - 1 + musicFiles.length) % musicFiles.length;
        playMusic(currentMusicIndex);
    }

    function toggleLoop() {
        isLoop = !isLoop;
        const audio = document.getElementById('audioPlayer');
        audio.loop = isLoop;
        document.getElementById('loopBtn').style.opacity = isLoop ? '1' : '0.5';
        const loopImg = document.getElementById('loopBtnImg');
        if (loopImg) {
            loopImg.src = isLoop ? 'loop_on.webp' : 'loop_off.webp';
            loopImg.alt = isLoop ? 'ループオン' : 'ループオフ';
        }
    }

    function toggleShuffle() {
        isShuffle = !isShuffle;
        document.getElementById('shuffleBtn').style.opacity = isShuffle ? '1' : '0.5';
        const shImg = document.getElementById('shuffleBtnImg');
        if (shImg) {
            shImg.src = isShuffle ? 'shuffle_on.webp' : 'shuffle_off.webp';
            shImg.alt = isShuffle ? 'シャッフルオン' : 'シャッフルオフ';
        }
    }

    function renameMusic(index) {
        const newName = prompt('新しい名前を入力してください', musicFiles[index].title);
        if (newName && newName.trim()) {
            musicFiles[index].title = newName.trim();
            savePlaylist();
            loadPlaylist();
        }
    }

    async function deleteMusic(index) {
        if (confirm('この曲を削除しますか?')) {
            const removed = musicFiles[index];
            if (currentMusicIndex === index) {
                const audio = document.getElementById('audioPlayer');
                if (audio) {
                    audio.pause();
                    audio.src = '';
                }
                currentMusicIndex = -1;
            } else if (currentMusicIndex > index) {
                currentMusicIndex--;
            }
            // try to remove blob from DB
            try {
                if (removed && removed.id != null) await deleteFileBlobFromDB(removed.id);
            } catch (e) {
                console.warn('Failed to delete blob from DB', e);
            }
            musicFiles.splice(index, 1);
            savePlaylist();
            loadPlaylist();
        }
    }

    document.getElementById('audioPlayer').addEventListener('ended', function() {
        if (!isLoop) playNext();
    });

    // Custom player integration: time/progress/volume
    const audioEl = document.getElementById('audioPlayer');
    // update play icon when audio plays/pauses
    audioEl.addEventListener('play', () => {
        const playImg = document.getElementById('playIconImg');
        if (playImg) { playImg.src = 'pause.webp'; playImg.alt = '一時停止'; }
    });
    audioEl.addEventListener('pause', () => {
        const playImg = document.getElementById('playIconImg');
        if (playImg) { playImg.src = 'play.webp'; playImg.alt = '再生'; }
    });

    // timeupdate -> update progress bar and time display
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const progressHandle = document.getElementById('progressHandle');
    const volumeBtn = document.getElementById('volumeBtn');
    const volumeBtnImg = document.getElementById('volumeBtnImg');
    const volumeSlider = document.getElementById('volumeSlider');

    function formatTimeShort(msOrSec) {
        // accept seconds or ms
        let totalSeconds = Math.floor(msOrSec);
        if (msOrSec > 1000) totalSeconds = Math.floor(msOrSec / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${minutes}:${String(seconds).padStart(2,'0')}`;
    }

    audioEl.addEventListener('timeupdate', () => {
        const cur = audioEl.currentTime;
        const dur = audioEl.duration || 0;
        const pct = dur ? (cur / dur) * 100 : 0;
        if (progressBar) progressBar.style.width = `${pct}%`;
        if (timeDisplay) timeDisplay.textContent = `${formatTimeShort(cur)} / ${formatTimeShort(dur)}`;
    });

    // seek when clicking progress container
    if (progressContainer) {
        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const pct = Math.max(0, Math.min(1, x / rect.width));
            if (audioEl.duration) audioEl.currentTime = pct * audioEl.duration;
        });
    }

    // volume toggle / slider
    if (volumeBtn) {
        volumeBtn.addEventListener('click', () => {
            if (volumeSlider.style.display === 'none') volumeSlider.style.display = 'block';
            else volumeSlider.style.display = 'none';
        });
    }
    if (volumeSlider) {
        volumeSlider.addEventListener('input', (e) => {
            audioEl.volume = parseFloat(e.target.value);
            if (audioEl.volume === 0) volumeBtnImg.src = 'volume_mute.webp';
            else if (audioEl.volume < 0.5) volumeBtnImg.src = 'volume_low.webp';
            else volumeBtnImg.src = 'volume.webp';
        });
    }

    // When a new track is played via playMusic, ensure UI resets will be done in playMusic

    function addTodo() {
        const input = document.getElementById('todoInput');
        const text = input.value.trim();
        if (!text) return;
        let todos = getCookie('todos');
        todos = todos ? JSON.parse(todos) : [];
        todos.push({text: text, completed: false, id: Date.now()});
        setCookie('todos', JSON.stringify(todos));
        input.value = '';
        loadTodos();
    }

    function loadTodos() {
        let todos = getCookie('todos');
        todos = todos ? JSON.parse(todos) : [];
        const todosDiv = document.getElementById('todoItems');
        if (todos.length === 0) {
            todosDiv.innerHTML = '<div class="empty-state">タスクがありません</div>';
            return;
        }
        todosDiv.innerHTML = todos.map((todo, index) => `
            <div class="todo-item ${todo.completed ? 'completed' : ''}">
                <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${index})">
                <span class="todo-text">${todo.text}</span>
                <button class="todo-delete" onclick="deleteTodo(${index})">削除</button>
            </div>
        `).join('');
    }

    function toggleTodo(index) {
        let todos = getCookie('todos');
        todos = todos ? JSON.parse(todos) : [];
        todos[index].completed = !todos[index].completed;
        setCookie('todos', JSON.stringify(todos));
        loadTodos();
    }

    function deleteTodo(index) {
        let todos = getCookie('todos');
        todos = todos ? JSON.parse(todos) : [];
        todos.splice(index, 1);
        setCookie('todos', JSON.stringify(todos));
        loadTodos();
    }

    function loadHistory() {
        const historyList = document.getElementById('historyList');
        const searchInput = document.getElementById('searchInput');
        const groupFilter = document.getElementById('groupFilter');
        const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
        const selectedGroup = groupFilter ? groupFilter.value : '';
        let history = getCookie('studyHistory');
        history = history ? JSON.parse(history) : [];
        allHistoryItems = [...history];
        if (selectedGroup) history = history.filter(item => item.group === selectedGroup);
        if (searchTerm) {
            history = history.filter(item => {
                const start = new Date(item.start);
                const end = new Date(item.end);
                const dateStr = formatDate(start).toLowerCase();
                const startTimeStr = formatDateTime(start).toLowerCase();
                const endTimeStr = formatDateTime(end).toLowerCase();
                return dateStr.includes(searchTerm) || startTimeStr.includes(searchTerm) || endTimeStr.includes(searchTerm);
            });
        }
        if (history.length === 0) {
            historyList.innerHTML = '<div class="empty-state">学習記録がありません</div>';
            updateActionButtons();
            return;
        }
        historyList.innerHTML = history.map((item, index) => {
            const actualIndex = allHistoryItems.findIndex(h => h.start === item.start && h.end === item.end && h.duration === item.duration);
            const start = new Date(item.start);
            const end = new Date(item.end);
            const groupBadge = item.group ? `<div class="group-badge">${item.group}</div>` : '';
            const isSelected = selectedItems.has(actualIndex);
            return `<div class="history-item ${isSelected ? 'selected' : ''}" onclick="toggleSelection(event, ${actualIndex})"><input type="checkbox" class="history-item-checkbox" ${isSelected ? 'checked' : ''} onclick="toggleSelection(event, ${actualIndex})"><div class="history-item-date">${formatDate(start)}</div><div class="history-item-time">開始: ${formatDateTime(start)}<br>終了: ${formatDateTime(end)}</div><div class="history-item-duration">学習時間: ${formatTime(item.duration)}</div>${groupBadge}</div>`;
        }).join('');
        updateActionButtons();
    }

    function toggleSelection(event, index) {
        event.stopPropagation();
        if (selectedItems.has(index)) selectedItems.delete(index);
        else selectedItems.add(index);
        loadHistory();
    }

    function toggleSelectAll() {
        const searchInput = document.getElementById('searchInput');
        const groupFilter = document.getElementById('groupFilter');
        const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
        const selectedGroup = groupFilter ? groupFilter.value : '';
        let history = [...allHistoryItems];
        if (selectedGroup) history = history.filter(item => item.group === selectedGroup);
        if (searchTerm) {
            history = history.filter(item => {
                const start = new Date(item.start);
                const end = new Date(item.end);
                const dateStr = formatDate(start).toLowerCase();
                const startTimeStr = formatDateTime(start).toLowerCase();
                const endTimeStr = formatDateTime(end).toLowerCase();
                return dateStr.includes(searchTerm) || startTimeStr.includes(searchTerm) || endTimeStr.includes(searchTerm);
            });
        }
        const visibleIndices = history.map(item => allHistoryItems.findIndex(h => h.start === item.start && h.end === item.end && h.duration === item.duration));
        const allSelected = visibleIndices.every(i => selectedItems.has(i));
        if (allSelected) visibleIndices.forEach(i => selectedItems.delete(i));
        else visibleIndices.forEach(i => selectedItems.add(i));
        loadHistory();
    }

    function updateActionButtons() {
        const moveContainer = document.getElementById('moveGroupContainer');
        const deleteBtn = document.getElementById('deleteBtn');
        const hasSelection = selectedItems.size > 0;
        if (moveContainer) {
            if (hasSelection) moveContainer.classList.add('active');
            else moveContainer.classList.remove('active');
        }
        if (deleteBtn) deleteBtn.disabled = !hasSelection;
    }

    function deleteSelected() {
        if (selectedItems.size === 0) return;
        if (confirm(`選択した${selectedItems.size}件の記録を削除しますか?`)) {
            let history = getCookie('studyHistory');
            history = history ? JSON.parse(history) : [];
            const indicesToDelete = Array.from(selectedItems).sort((a, b) => b - a);
            indicesToDelete.forEach(index => { history.splice(index, 1); });
            setCookie('studyHistory', JSON.stringify(history));
            selectedItems.clear();
            updateGroupFilter();
            loadHistory();
        }
    }

    function hideMoveGroup() {
        selectedItems.clear();
        document.getElementById('moveGroupInput').value = '';
        loadHistory();
    }

    function moveSelectedToGroup() {
        const newGroup = document.getElementById('moveGroupInput').value.trim();
        if (selectedItems.size === 0) return;
        let history = getCookie('studyHistory');
        history = history ? JSON.parse(history) : [];
        Array.from(selectedItems).forEach(index => {
            if (history[index]) history[index].group = newGroup;
        });
        setCookie('studyHistory', JSON.stringify(history));
        selectedItems.clear();
        document.getElementById('moveGroupInput').value = '';
        updateGroupFilter();
        loadHistory();
    }

    function updateGroupFilter() {
        let history = getCookie('studyHistory');
        history = history ? JSON.parse(history) : [];
        const groups = [...new Set(history.map(item => item.group).filter(g => g))];
        const groupFilter = document.getElementById('groupFilter');
        groupFilter.innerHTML = '<option value="">すべてのグループ</option>';
        groups.forEach(group => {
            groupFilter.innerHTML += `<option value="${group}">${group}</option>`;
        });
    }

    function calculateStreak() {
        let history = getCookie('studyHistory');
        history = history ? JSON.parse(history) : [];
        if (history.length === 0) return 0;
        const dates = [...new Set(history.map(item => {
            const date = new Date(item.start);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }))].sort().reverse();
        let streak = 0;
        const today = new Date();
        for (let i = 0; i < dates.length; i++) {
            const expectedDate = new Date(today);
            expectedDate.setDate(today.getDate() - i);
            const expectedStr = `${expectedDate.getFullYear()}-${String(expectedDate.getMonth() + 1).padStart(2, '0')}-${String(expectedDate.getDate()).padStart(2, '0')}`;
            if (dates[i] === expectedStr) streak++;
            else break;
        }
        return streak;
    }

    function loadStats() {
        let history = getCookie('studyHistory');
        history = history ? JSON.parse(history) : [];
        const totalTime = history.reduce((sum, item) => sum + item.duration, 0);
        const streak = calculateStreak();
        const totalSessions = history.length;
        const statsContainer = document.getElementById('statsContainer');
        statsContainer.innerHTML = `<div class="stat-card"><div class="stat-label">トータル勉強時間</div><div class="stat-value">${formatTime(totalTime)}</div></div><div class="stat-card"><div class="stat-label">連続日数</div><div class="stat-value">${streak}日</div></div><div class="stat-card"><div class="stat-label">総セッション数</div><div class="stat-value">${totalSessions}</div></div>`;
        const groups = {};
        history.forEach(item => {
            const group = item.group || '未分類';
            if (!groups[group]) groups[group] = 0;
            groups[group] += item.duration;
        });
        const groupStatsSelector = document.getElementById('groupStatsSelector');
        const groupStats = document.getElementById('groupStats');
        if (Object.keys(groups).length > 0) {
            groupStatsSelector.innerHTML = '<h2 style="font-size: 1.2rem; margin-bottom: 15px; font-weight: 500;">グループ別統計</h2>';
            groupStats.innerHTML = Object.entries(groups).sort((a, b) => b[1] - a[1]).map(([group, duration]) => `<div class="stat-card" style="margin-bottom: 15px;"><div class="stat-label">${group}</div><div class="stat-value">${formatTime(duration)}</div></div>`).join('');
        }
    }

    function clearHistory() {
        if (confirm('すべての学習記録を削除しますか?')) {
            setCookie('studyHistory', JSON.stringify([]));
            selectedItems.clear();
            loadHistory();
        }
    }

    window.onload = function() {
        const mode = getCookie('mode');
        const theme = getCookie('theme');
        const themeIcon = document.getElementById('themeIcon');
        if (mode === 'dark') {
            document.body.classList.remove('light');
            document.body.classList.add('dark');
            themeIcon.src = 'sun.webp';
            themeIcon.alt = 'ライトモードに切り替え';
        }
        if (theme) {
            document.body.setAttribute('data-theme', theme);
            document.querySelectorAll('.theme-option').forEach(option => { option.classList.remove('selected'); });
            document.querySelector(`[data-theme="${theme}"]`)?.classList.add('selected');
        }
        const musicEnabled = getCookie('feature_music') === 'true';
        const todoEnabled = getCookie('feature_todo') === 'true';
        if (musicEnabled) {
            document.getElementById('toggleMusic').classList.add('active');
            addMenuButton('music');
        }
        if (todoEnabled) {
            document.getElementById('toggleTodo').classList.add('active');
            addMenuButton('todo');
        }
        
        let history = getCookie('studyHistory');
        history = history ? JSON.parse(history) : [];
        if (history.length > 0) {
            const last = history[0];
            const start = new Date(last.start);
            const end = new Date(last.end);
            document.getElementById('sessionInfo').innerHTML = 
                `前回の学習<br>開始: ${formatDateTime(start)} / 終了: ${formatDateTime(end)}<br>学習時間: ${formatTime(last.duration)}`;
        }

        // Initialize control icons state
        const loopImg = document.getElementById('loopBtnImg');
        if (loopImg) {
            loopImg.src = isLoop ? 'loop_on.webp' : 'loop_off.webp';
            loopImg.alt = isLoop ? 'ループオン' : 'ループオフ';
            document.getElementById('loopBtn').style.opacity = isLoop ? '1' : '0.5';
        }
        const shImg = document.getElementById('shuffleBtnImg');
        if (shImg) {
            shImg.src = isShuffle ? 'shuffle_on.webp' : 'shuffle_off.webp';
            shImg.alt = isShuffle ? 'シャッフルオン' : 'シャッフルオフ';
            document.getElementById('shuffleBtn').style.opacity = isShuffle ? '1' : '0.5';
        }
        const playImg = document.getElementById('playIconImg');
        if (playImg) {
            playImg.src = 'play.webp';
            playImg.alt = '再生';
        }

        // set initial audio volume and volume slider
        const audioEl = document.getElementById('audioPlayer');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeBtnImg = document.getElementById('volumeBtnImg');
        if (audioEl) {
            audioEl.volume = 1;
            if (volumeSlider) {
                volumeSlider.value = audioEl.volume;
                volumeSlider.style.display = 'none';
            }
            if (volumeBtnImg) volumeBtnImg.src = 'volume.webp';
        }
        // Restore persisted playlist from IndexedDB if available
        (async () => {
            try {
                const playlistCookie = getCookie('musicPlaylist');
                if (playlistCookie) {
                    const list = JSON.parse(playlistCookie);
                    for (const item of list) {
                        try {
                            const blob = await getFileBlobFromDB(item.id);
                            if (blob) {
                                const url = URL.createObjectURL(blob);
                                musicFiles.push({ url: url, title: item.title, id: item.id });
                            }
                        } catch (e) {
                            console.warn('Error loading blob for', item, e);
                        }
                    }
                    // if we loaded any files, refresh playlist UI
                    if (musicFiles.length > 0) loadPlaylist();
                }
            } catch (e) {
                console.error('Failed to restore playlist from DB', e);
            }
        })();
    };
</script>
