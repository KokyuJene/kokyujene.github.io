<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"="width=device-width, initial-scale=1.0">
  <title>栞</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@300;400&family=Hina+Mincho&family=JetBrains+Mono:wght@300;400&family=Jost:wght@300;400&family=Klee+One:wght@300;400&family=Lora:wght@400&family=Montserrat:wght@300;400&family=Noto+Sans+JP:wght@300;400&family=Quicksand:wght@300;400&family=Sawarabi+Gothic&family=Zen+Kaku+Gothic+Antique:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@300;400&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #f8f9fb;
      --bg-secondary: #f0f2f7;
      --bg-tertiary: #e6e8ed;
      --accent-primary: #9db4c8;
      --accent-secondary: #d4eaf2;
      --accent-tertiary: #dfe1e6;
      --text-primary: #3a3a3a;
      --text-secondary: #5a5a5a;
      --text-tertiary: #7a8b9c;
      --border-color: #dfe1e6;
      --error-color: #b3261e;
      --shadow-1: 0 4px 12px rgba(0, 0, 0, 0.05);
      --shadow-2: 0 8px 24px rgba(0, 0, 0, 0.08);
      --shadow-3: 0 12px 32px rgba(0, 0, 0, 0.12);
      --font-family: 'Zen Kaku Gothic Antique', sans-serif;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background-color 0.3s;
    }

    /* Desktop Sidebar */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 280px;
      height: 100vh;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      z-index: 100;
    }

    .logo {
      font-size: 28px;
      font-weight: 500;
      color: var(--accent-primary);
      margin-bottom: 32px;
      padding: 8px 16px;
      letter-spacing: 2px;
    }

    .nav-list {
      list-style: none;
      flex: 1;
    }

    .nav-list-item {
      margin-bottom: 4px;
    }

    .nav-button {
      width: 100%;
      padding: 12px 24px 12px 16px;
      background: none;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-family: inherit;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      text-align: left;
    }

    .nav-button:hover {
      background-color: var(--accent-tertiary);
    }

    .nav-button.active {
      background-color: var(--accent-secondary);
      color: var(--text-primary);
      font-weight: 500;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Main Content */
    .main-content {
      margin-left: 280px;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .page {
      display: none;
      animation: fadeIn 0.3s;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-header {
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-title {
      font-size: 32px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .selection-mode-bar {
      display: none;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      background-color: var(--accent-tertiary);
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .selection-mode-bar.active {
      display: flex;
    }

    /* Cards */
    .diary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .diary-card {
      background-color: var(--bg-secondary);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: var(--shadow-1);
      position: relative;
    }

    .diary-card:hover {
      box-shadow: var(--shadow-2);
      transform: translateY(-2px);
    }

    .diary-card.selected {
      border-color: var(--accent-primary);
      background-color: var(--accent-tertiary);
    }

    .diary-card-checkbox {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      display: none;
      cursor: pointer;
    }

    .selection-mode .diary-card-checkbox {
      display: block;
    }

    .diary-card.selected .diary-card-checkbox {
      background-color: var(--accent-primary);
      border-color: var(--accent-primary);
    }

    .diary-date {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-bottom: 12px;
    }

    .diary-preview {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Buttons */
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background-color: var(--accent-primary);
      color: white;
    }

    .btn-primary:hover {
      box-shadow: var(--shadow-2);
    }

    .btn-secondary {
      background-color: var(--accent-tertiary);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background-color: var(--accent-secondary);
    }

    .btn-text {
      background: none;
      color: var(--accent-primary);
      padding: 8px 16px;
    }

    .btn-text:hover {
      background-color: var(--accent-tertiary);
    }

    .btn-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .fab {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background-color: var(--accent-primary);
      color: white;
      border: none;
      font-size: 24px;
      cursor: pointer;
      box-shadow: var(--shadow-3);
      transition: all 0.2s;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fab:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      overflow-y: auto;
      padding: 24px;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background-color: var(--bg-secondary);
      padding: 32px;
      border-radius: 14px;
      width: 100%;
      max-width: 800px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .close-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: background-color 0.2s;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      background-color: var(--accent-tertiary);
    }

    /* Editor */
    .editor-container {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background-color: var(--bg-primary);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .editor-toolbar {
      display: flex;
      gap: 4px;
      padding: 8px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-secondary);
      flex-wrap: wrap;
    }

    .editor-btn {
      padding: 8px 12px;
      background: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-family: inherit;
    }

    .editor-btn:hover {
      background-color: var(--accent-tertiary);
    }

    .editor-btn.active {
      background-color: var(--accent-secondary);
      color: var(--text-primary);
    }

    .editor-separator {
      width: 1px;
      background-color: var(--border-color);
      margin: 4px 4px;
    }

    .editor-select {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-primary);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .editor {
      width: 100%;
      min-height: 400px;
      padding: 24px;
      border: none;
      font-size: 15px;
      line-height: 1.8;
      font-family: inherit;
      resize: vertical;
      outline: none;
      color: var(--text-primary);
      background-color: var(--bg-secondary);
    }

    .editor:focus {
      outline: none;
    }

    .editor [style*="color: rgb(0, 0, 0)"],
    .editor [style*="color:#000000"],
    .editor [style*="color: #000"] {
      color: var(--text-primary) !important;
    }

    /* Calendar */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 16px;
      background-color: var(--bg-secondary);
      border-radius: 12px;
    }

    .calendar-nav-btn {
      background: none;
      border: none;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .calendar-nav-btn:hover {
      background-color: var(--accent-tertiary);
    }

    .calendar-month {
      font-size: 20px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 32px;
    }

    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-secondary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      position: relative;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .calendar-day:hover {
      background-color: var(--accent-tertiary);
    }

    .calendar-day.has-event {
      border-color: var(--accent-primary);
    }

    .calendar-day.has-event::after {
      content: '';
      position: absolute;
      bottom: 6px;
      width: 4px;
      height: 4px;
      background-color: var(--accent-primary);
      border-radius: 50%;
    }

    .calendar-day.header {
      background-color: transparent;
      font-weight: 500;
      color: var(--text-tertiary);
      cursor: default;
    }

    .calendar-day.header:hover {
      background-color: transparent;
    }

    /* Events */
    .event-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .event-item {
      background-color: var(--bg-secondary);
      padding: 16px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
      position: relative;
    }

    .event-item.selected {
      border-color: var(--accent-primary);
      background-color: var(--accent-tertiary);
    }

    .event-checkbox {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      display: none;
      cursor: pointer;
    }

    .selection-mode .event-checkbox {
      display: block;
    }

    .event-item.selected .event-checkbox {
      background-color: var(--accent-primary);
      border-color: var(--accent-primary);
    }

    /* Settings */
    .settings-section {
      background-color: var(--bg-secondary);
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .settings-title {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 20px;
      color: var(--text-primary);
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .color-picker-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .color-picker-label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .color-input-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .color-input {
      width: 48px;
      height: 48px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .color-input:hover {
      transform: scale(1.05);
    }

    .color-input::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-input::-webkit-color-swatch {
      border: none;
      border-radius: 10px;
    }

    .color-hex {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }

    .theme-presets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .theme-preset {
      padding: 16px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .theme-preset:hover {
      border-color: var(--accent-primary);
      transform: translateY(-2px);
    }

    .theme-preset-name {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .theme-preset-colors {
      display: flex;
      gap: 4px;
      justify-content: center;
    }

    .theme-preset-color {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
    }

    .font-selector {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: inherit;
      cursor: pointer;
    }

    /* Input */
    input[type="text"],
    input[type="date"],
    input[type="time"],
    textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
      background-color: var(--bg-primary);
      font-family: inherit;
      color: var(--text-primary);
      transition: border-color 0.2s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent-primary);
    }

    ::placeholder {
      color: var(--text-tertiary);
      opacity: 0.6;
    }

    /* Custom Dialog */
    .custom-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 24px;
      backdrop-filter: blur(4px);
    }

    .custom-modal-overlay.active {
      display: flex;
    }

    .custom-modal {
      background-color: var(--bg-secondary);
      padding: 32px;
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-3);
      text-align: center;
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .custom-modal-title {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .custom-modal-message {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .custom-modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .custom-modal-buttons .btn {
      flex: 1;
      justify-content: center;
    }

    /* Mobile Bottom Nav */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      padding: 8px 0;
      z-index: 100;
    }

    .bottom-nav-list {
      display: flex;
      justify-content: space-around;
      list-style: none;
    }

    .bottom-nav-item {
      flex: 1;
      text-align: center;
    }

    .bottom-nav-button {
      width: 100%;
      padding: 8px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      font-size: 12px;
      font-family: inherit;
      border-radius: 12px;
      transition: all 0.2s;
    }

    .bottom-nav-button.active {
      color: var(--accent-primary);
    }

    .bottom-nav-icon {
      width: 24px;
      height: 24px;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .main-content {
        margin-left: 0;
        padding: 16px;
        padding-bottom: 80px;
      }

      .bottom-nav {
        display: block;
      }

      .fab {
        bottom: 80px;
        right: 16px;
      }

      .page-title {
        font-size: 24px;
      }

      .diary-grid {
        grid-template-columns: 1fr;
      }

      .modal-content {
        padding: 20px;
        border-radius: 20px;
      }

      .editor {
        min-height: 300px;
        padding: 16px;
      }

      .color-grid {
        grid-template-columns: 1fr;
      }

      .theme-presets {
        grid-template-columns: repeat(2, 1fr);
      }

      .calendar-grid {
        gap: 4px;
      }

      .calendar-day {
        font-size: 13px;
      }
    }

    /* Insights Page Styles */
    .insights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background-color: var(--bg-secondary);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-4px);
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--accent-primary);
    }

    .stat-label {
      font-size: 14px;
      color: var(--text-tertiary);
      font-weight: 500;
    }

    .chart-container {
      background-color: var(--bg-secondary);
      padding: 32px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      margin-bottom: 32px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .chart-title {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* Heatmap Styles */
    .heatmap-wrapper {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .heatmap-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 800px;
    }

    .heatmap-row {
      display: flex;
      gap: 4px;
    }

    .heatmap-cell {
      width: 12px;
      height: 12px;
      background-color: var(--bg-tertiary);
      border-radius: 2px;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
    }

    .heatmap-cell:hover::after {
      content: attr(data-date);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-primary);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      white-space: nowrap;
      z-index: 10;
    }

    .cell-level-1 {
      background-color: rgba(157, 180, 200, 0.2);
    }

    .cell-level-2 {
      background-color: rgba(157, 180, 200, 0.5);
    }

    .cell-level-3 {
      background-color: rgba(157, 180, 200, 0.8);
    }

    .cell-level-4 {
      background-color: var(--accent-primary);
    }

    /* Donut Chart Styles */
    .donut-chart {
      display: flex;
      align-items: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .donut-svg {
      width: 200px;
      height: 200px;
      transform: rotate(-90deg);
    }

    .donut-segment {
      fill: none;
      stroke-width: 12;
      transition: stroke-dasharray 0.6s ease;
    }

    .donut-legend {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      min-width: 200px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    /* Tag Cloud Styles */
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: baseline;
      justify-content: center;
    }

    .cloud-tag {
      color: var(--accent-primary);
      text-decoration: none;
      transition: all 0.2s;
      cursor: default;
    }

    .cloud-tag:hover {
      transform: scale(1.1);
      color: var(--text-primary);
    }

    .template-btn {
      position: relative;
    }

    .template-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: var(--shadow-2);
      z-index: 200;
      min-width: 200px;
      margin-top: 8px;
      overflow: hidden;
    }

    .template-dropdown.active {
      display: block;
    }

    .template-item {
      padding: 12px 16px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .template-item:hover {
      background-color: var(--accent-tertiary);
    }
  </style>

    // Load data from localStorage
    function loadData() {
      const savedDiaries = localStorage.getItem('shiori_diaries');
      const savedEvents = localStorage.getItem('shiori_events');
      const savedTheme = localStorage.getItem('shiori_theme');
      const savedFont = localStorage.getItem('shiori_font');

      if (savedDiaries) diaries = JSON.parse(savedDiaries);
      if (savedEvents) events = JSON.parse(savedEvents);
      if (savedTheme) {
        const theme = JSON.parse(savedTheme);
        if (theme.preset) {
          currentPreset = theme.preset;
          isDarkMode = theme.isDark || false;
          applyPreset(currentPreset, false);
          updateToggleButtons();
        } else {
          applyThemeColors(theme);
        }
      } else {
        applyPreset('default', false);
      }
      if (savedFont) {
        document.documentElement.style.setProperty('--font-family', savedFont);
        document.getElementById('fontSelector').value = savedFont;
      }
    }

    // Save data to localStorage
    function saveDiaries() {
      localStorage.setItem('shiori_diaries', JSON.stringify(diaries));
    }

    function saveEvents() {
      localStorage.setItem('shiori_events', JSON.stringify(events));
    }

    // Page switching
    function switchPage(pageName) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageName).classList.add('active');

      document.querySelectorAll('.nav-button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.bottom-nav-button').forEach(btn => btn.classList.remove('active'));

      event.currentTarget.classList.add('active');

      if (pageName === 'diary') renderDiaries();
      if (pageName === 'calendar') {
        renderCalendar();
        renderEvents();
      }
      if (pageName === 'insights') renderInsights();
    }


    // Data Backup
    function exportData() {
      const data = {
        diaries: diaries,
        events: events,
        theme: JSON.parse(localStorage.getItem('shiori_theme') || '{}'),
        font: localStorage.getItem('shiori_font')
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
      const downloadAnchorNode = document.createElement('a');
      downloadAnchorNode.setAttribute("href", dataStr);
      downloadAnchorNode.setAttribute("download", "shiori_backup_" + new Date().toISOString().slice(0, 10) + ".json");
      document.body.appendChild(downloadAnchorNode);
      downloadAnchorNode.click();
      downloadAnchorNode.remove();
    }

    function importData() {
      document.getElementById('importFile').click();
    }

    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function (e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data.diaries) {
            diaries = data.diaries;
            saveDiaries();
          }
          if (data.events) {
            events = data.events;
            saveEvents();
          }
          if (data.theme) {
            localStorage.setItem('shiori_theme', JSON.stringify(data.theme));
          }
          if (data.font) {
            localStorage.setItem('shiori_font', data.font);
          }

          await customAlert('データの復元が完了しました。ページを再読み込みします。');
          location.reload();
        } catch (error) {
          console.error(error);
          await customAlert('ファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
    }

    // Diary functions
    function openEditor(id = null) {
      // If we are on calendar page, FAB should probably open calendar modal
      const calendarPage = document.getElementById('calendar').classList.contains('active');
      if (calendarPage && !id) {
        openEventModal();
        return;
      }
      editingDiaryId = id;
      const modal = document.getElementById('editorModal');
      const editor = document.getElementById('diaryEditor');
      const title = modal.querySelector('.modal-title');
      const moodSelect = document.getElementById('diaryMood');
      const tagsInput = document.getElementById('diaryTags');

      if (id) {
        const diary = diaries.find(d => d.id === id);
        editor.innerHTML = diary.content;
        moodSelect.value = diary.mood || '';
        tagsInput.value = diary.tags ? diary.tags.join(', ') : '';
        title.textContent = '日記を編集';
      } else {
        editor.innerHTML = '';
        moodSelect.value = '';
        tagsInput.value = '';
        title.textContent = '日記を書く';
      }

      updateCharCount();
      modal.classList.add('active');
      editor.focus();
    }

    function updateCharCount() {
      const text = document.getElementById('diaryEditor').innerText;
      document.getElementById('charCount').textContent = `${text.length}文字`;
    }

    function togglePinState() {
      // This button just toggles a visual state in the editor if we were strictly binding it, 
      // but simpler to just handle it during save or have a dataset property. 
      // For now, let's keep it simple: We pin via the card action, or we could add a checkbox. 
      // Let's implement pin toggle on the card view instead for better UX.
      // Or we can add a class to the button to show "active" state.
      const btn = document.getElementById('togglePinBtn');
      btn.classList.toggle('active');
      btn.style.opacity = btn.classList.contains('active') ? '1' : '0.5';
      btn.style.color = btn.classList.contains('active') ? 'var(--accent-primary)' : 'inherit';
    }

    function closeEditor() {
      document.getElementById('editorModal').classList.remove('active');
      editingDiaryId = null;
      // Reset pin button visual
      const btn = document.getElementById('togglePinBtn');
      btn.classList.remove('active');
      btn.style.opacity = '0.5';
      btn.style.color = 'inherit';
    }

    async function saveDiary() {
      const content = document.getElementById('diaryEditor').innerHTML;
      const mood = document.getElementById('diaryMood').value;
      const tagsStr = document.getElementById('diaryTags').value;
      // Pin state from editor button
      const isPinned = document.getElementById('togglePinBtn').classList.contains('active');

      if (!content.trim()) {
        await customAlert('内容を入力してください');
        return;
      }

      const tags = tagsStr.split(',').map(t => t.trim()).filter(t => t);

      if (editingDiaryId) {
        const diary = diaries.find(d => d.id === editingDiaryId);
        diary.content = content;
        diary.mood = mood;
        diary.tags = tags;
        // Don't overwrite pin state if we didn't explicitly toggle it? 
        // Actually, let's assume the editor state overrides. 
        diary.isPinned = isPinned;
        diary.updatedAt = new Date().toISOString();
      } else {
        diaries.unshift({
          id: Date.now(),
          content: content,
          mood: mood,
          tags: tags,
          isPinned: isPinned,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });
      }

      saveDiaries();
      renderDiaries();
      closeEditor();
    }

    function renderDiaries() {
      const list = document.getElementById('diaryList');
      list.innerHTML = '';

      const searchTerm = (document.getElementById('diarySearch').value || '').toLowerCase();

      // Sort: Pinned first, then by date
      const sortedDiaries = [...diaries].sort((a, b) => {
        if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
        return new Date(b.createdAt) - new Date(a.createdAt);
      });

      const filteredDiaries = sortedDiaries.filter(d => {
        const contentMatch = d.content.toLowerCase().includes(searchTerm);
        const tagMatch = d.tags && d.tags.some(t => t.toLowerCase().includes(searchTerm));
        return contentMatch || tagMatch;
      });

      filteredDiaries.forEach(diary => {
        const card = document.createElement('div');
        card.className = 'diary-card';
        if (selectedItems.diary.has(diary.id)) card.classList.add('selected');
        // Add pinned visual style
        if (diary.isPinned) card.style.borderLeft = '4px solid var(--accent-primary)';

        const date = new Date(diary.createdAt);
        const dateStr = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;

        // Mood Icon
        const moodIcons = {
          'sunny': '☀', 'cloudy': '☁', 'rainy': '☔', 'star': '⭐',
          'heart': '❤', 'fire': '🔥', 'book': '📚', 'coffee': '☕'
        };
        const moodIcon = diary.mood ? `<span style="margin-left:8px; font-size:1.1em;">${moodIcons[diary.mood] || ''}</span>` : '';
        const pinIcon = diary.isPinned ? `<span style="margin-left:auto; color:var(--accent-primary);">📌</span>` : '';

        // Tags HTML
        const tagsHtml = diary.tags && diary.tags.length > 0
          ? `<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">
              ${diary.tags.map(t => `<span style="font-size:11px; padding:2px 8px; background:var(--bg-tertiary); border-radius:10px; color:var(--text-secondary);">#${t}</span>`).join('')}
             </div>`
          : '';

        const preview = document.createElement('div');
        preview.className = 'diary-preview';
        preview.innerHTML = diary.content; // Use innerHTML to render bold/italic correctly

        card.innerHTML = `
          <div style="display:flex; align-items:center; margin-bottom:8px;">
            <div class="diary-card-checkbox" onclick="toggleDiarySelection(${diary.id}, event)"></div>
            <div class="diary-date">${dateStr}</div>
            ${moodIcon}
            ${pinIcon}
          </div>
        `;
        card.appendChild(preview);
        if (tagsHtml) card.innerHTML += tagsHtml;

        card.onclick = (e) => {
          if (!selectionMode.diary && !e.target.classList.contains('diary-card-checkbox')) {
            openEditor(diary.id);
          }
        };

        list.appendChild(card);
      });

      if (filteredDiaries.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:var(--text-tertiary); padding:40px;">日記が見つかりません</p>';
      }
    }

    // Selection mode
    function toggleSelectionMode(type) {
      selectionMode[type] = !selectionMode[type];
      selectedItems[type].clear();

      const container = document.getElementById(type === 'diary' ? 'diary' : 'calendar');
      if (selectionMode[type]) {
        container.classList.add('selection-mode');
      } else {
        container.classList.remove('selection-mode');
      }

      const bar = document.getElementById(type === 'diary' ? 'diarySelectionBar' : 'eventSelectionBar');
      bar.classList.toggle('active', selectionMode[type]);

      if (type === 'diary') renderDiaries();
      if (type === 'event') renderEvents();
      updateSelectionCount(type);
    }

    function toggleDiarySelection(id, event) {
      event.stopPropagation();
      if (selectedItems.diary.has(id)) {
        selectedItems.diary.delete(id);
      } else {
        selectedItems.diary.add(id);
      }
      renderDiaries();
      updateSelectionCount('diary');
    }

    function toggleEventSelection(id, event) {
      event.stopPropagation();
      if (selectedItems.event.has(id)) {
        selectedItems.event.delete(id);
      } else {
        selectedItems.event.add(id);
      }
      renderEvents();
      updateSelectionCount('event');
    }

    function updateSelectionCount(type) {
      const countEl = document.getElementById(type === 'diary' ? 'diarySelectedCount' : 'eventSelectedCount');
      countEl.textContent = `${selectedItems[type].size}件選択中`;
    }

    async function deleteSelectedDiaries() {
      if (selectedItems.diary.size === 0) return;
      const confirmed = await customConfirm(`${selectedItems.diary.size}件の日記を削除しますか?`, '日記の削除');
      if (!confirmed) return;

      diaries = diaries.filter(d => !selectedItems.diary.has(d.id));
      saveDiaries();
      cancelSelection('diary');

    async function deleteSelectedEvents() {
      if (selectedItems.event.size === 0) return;
      const confirmed = await customConfirm(`${selectedItems.event.size}件の予定を削除しますか?`, '予定の削除');

    function insertHeading(tag) {
      const selection = window.getSelection();
      if (selection.rangeCount > 0) {
        const range = selection.getRangeAt(0);
        const heading = document.createElement(tag);
        heading.textContent = selection.toString() || `見出し ${tag.toUpperCase()}`;

    // Calendar functions
    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const monthEl = document.getElementById('currentMonth');

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      monthEl.textContent = `${year}年${month + 1}月`;

      grid.innerHTML = '';

      const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
      dayNames.forEach(name => {
        const day = document.createElement('div');
        day.className = 'calendar-day header';
        day.textContent = name;
        grid.appendChild(day);
      });

      const firstDay = new Date(year, month, 1).getDay();

        const empty = document.createElement('div');
        empty.className = 'calendar-day';
        empty.style.visibility = 'hidden';
        grid.appendChild(empty);

      for (let day = 1; day <= daysInMonth; day++) {

    async function saveEvent() {
      const date = document.getElementById('eventDate').value;
      const time = document.getElementById('eventTime').value;
      const title = document.getElementById('eventTitle').value;
      const description = document.getElementById('eventDescription').value;

      if (!date || !title) {
        await customAlert('日付とタイトルを入力してください');
        return;
      }

      events.push({
        id: Date.now(),
        date: date,
        time: time,
        title: title,
        description: description
      });

      events.sort((a, b) => {
        const dateA = new Date(a.date + ' ' + (a.time || '00:00'));
        const dateB = new Date(b.date + ' ' + (b.time || '00:00'));
        return dateA - dateB;
      });

      saveEvents();
      renderCalendar();
      renderEvents();
      closeEventModal();
    }

    function renderEvents() {
      const list = document.getElementById('eventList');
      list.innerHTML = '';

      const searchTerm = (document.getElementById('eventSearch').value || '').toLowerCase();

      const now = new Date();
      // Filter upcoming events that match search
      const upcomingEvents = events.filter(e => {
        const isFuture = new Date(e.date) >= now;
        const titleMatch = e.title.toLowerCase().includes(searchTerm);
        const descMatch = e.description && e.description.toLowerCase().includes(searchTerm);
        return isFuture && (titleMatch || descMatch);
      });

      upcomingEvents.forEach(event => {
        const item = document.createElement('div');
        item.className = 'event-item';
        if (selectedItems.event.has(event.id)) item.classList.add('selected');

        const date = new Date(event.date);
        const dateStr = `${date.getMonth() + 1}月${date.getDate()}日`;
        const timeStr = event.time ? ` ${event.time}` : '';

        item.innerHTML = `
          <div class="event-checkbox" onclick="toggleEventSelection(${event.id}, event)"></div>
          <div>
            <div style="font-weight:500; margin-bottom:4px;">${event.title}</div>
            <div style="font-size:13px; color:var(--text-tertiary);">${dateStr}${timeStr}</div>
            ${event.description ? `<div style="font-size:13px; color:var(--text-secondary); margin-top:4px;">${event.description}</div>` : ''}
          </div>
        `;

        list.appendChild(item);
      });

      if (upcomingEvents.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:var(--text-tertiary); padding:40px;">予定がありません</p>';
      }
    }

    function calculateStats() {
      const totalDiaries = diaries.length;
      document.getElementById('totalDiaries').textContent = totalDiaries;

      const now = new Date();
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const monthDiaries = diaries.filter(d => new Date(d.createdAt) >= monthStart).length;
      document.getElementById('monthDiaries').textContent = monthDiaries;

      // Streak calculation
      let streak = 0;
      const sortedDates = diaries.map(d => new Date(d.createdAt).toDateString())
        .filter((v, i, a) => a.indexOf(v) === i)
        .sort((a, b) => new Date(b) - new Date(a));

      let checkDate = new Date();
      if (sortedDates.length > 0 && sortedDates[0] === new Date().toDateString()) {
        for (let i = 0; i < sortedDates.length; i++) {
          const date = new Date(sortedDates[i]);
          const diff = (new Date(checkDate.toDateString()) - date) / (1000 * 60 * 60 * 24);
          if (diff <= 1) {
            streak++;
            checkDate = date;
          } else {
            break;
          }
        }
      }
      document.getElementById('currentStreak').textContent = `${streak}日`;

      const totalChars = diaries.reduce((acc, d) => acc + (d.content.replace(/<[^>]*>/g, '').length), 0);
      document.getElementById('totalChars').textContent = totalChars.toLocaleString();
    }

    const MOOD_COLORS = {
      'sunny': '#ffcc80', 'cloudy': '#b0bec5', 'rainy': '#90caf9', 'star': '#fff59d',
      'heart': '#f48fb1', 'fire': '#ef9a9a', 'book': '#a5d6a7', 'coffee': '#bcaaa4',
      'default': 'var(--bg-tertiary)'
    };

    const MOOD_LABELS = {
      'sunny': '晴れやか', 'cloudy': 'もやもや', 'rainy': 'ブルー', 'star': '最高',
      'heart': '感謝', 'fire': 'やる気', 'book': '学び', 'coffee': '休憩'
    };

    function renderMoodChart() {
      const moodCounts = {};
      diaries.forEach(d => {
        if (d.mood) moodCounts[d.mood] = (moodCounts[d.mood] || 0) + 1;
      });

      const container = document.getElementById('moodChartContainer');
      if (Object.keys(moodCounts).length === 0) {
        container.innerHTML = '<p style="color:var(--text-tertiary);">データが不足しています</p>';
        return;
      }

      const total = Object.values(moodCounts).reduce((a, b) => a + b, 0);
      let cumulativePercent = 0;

      const svgParts = [];
      const legendParts = [];

      Object.entries(moodCounts).forEach(([mood, count]) => {
        const percent = count / total;
        const color = MOOD_COLORS[mood] || MOOD_COLORS.default;

        // Calculate SVG arc path
        const startX = Math.cos(2 * Math.PI * cumulativePercent);
        const startY = Math.sin(2 * Math.PI * cumulativePercent);
        cumulativePercent += percent;
        const endX = Math.cos(2 * Math.PI * cumulativePercent);
        const endY = Math.sin(2 * Math.PI * cumulativePercent);

        const largeArcFlag = percent > 0.5 ? 1 : 0;
        const pathData = [
          `M ${startX * 80 + 100} ${startY * 80 + 100}`,
          `A 80 80 0 ${largeArcFlag} 1 ${endX * 80 + 100} ${endY * 80 + 100}`
        ].join(' ');

        svgParts.push(`<path d="${pathData}" stroke="${color}" class="donut-segment" fill="none" />`);
        legendParts.push(`
          <div class="legend-item">
            <div class="legend-color" style="background:${color}"></div>
            <span>${MOOD_LABELS[mood]} (${count}件)</span>
          </div>
        `);
      });

      container.innerHTML = `
        <svg class="donut-svg" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="80" stroke="var(--bg-tertiary)" stroke-width="12" fill="none" />
          ${svgParts.join('')}
        </svg>
        <div class="donut-legend">${legendParts.join('')}</div>
      `;
    }

    function renderActivityHeatmap() {
      const container = document.getElementById('activityHeatmap');
      container.innerHTML = '';

      const diaryDates = {};
      diaries.forEach(d => {
        const date = new Date(d.createdAt).toDateString();
        diaryDates[date] = (diaryDates[date] || 0) + 1;
      });

      const today = new Date();
      const cellSize = 12;
      const gap = 4;

      // Render 53 weeks (approx 1 year)
      for (let row = 0; row < 7; row++) {
        const rowEl = document.createElement('div');
        rowEl.className = 'heatmap-row';

        for (let col = 0; col < 53; col++) {
          const date = new Date();
          date.setDate(today.getDate() - (52 - col) * 7 - (today.getDay() - row));

          const cell = document.createElement('div');
          cell.className = 'heatmap-cell';
          const count = diaryDates[date.toDateString()] || 0;
          if (count > 0) {
            const level = Math.min(4, Math.ceil(count / 2));
            cell.classList.add(`cell-level-${level}`);
          }
          cell.setAttribute('data-date', `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()} (${count}件)`);

          rowEl.appendChild(cell);
        }
        container.appendChild(rowEl);
      }
    }

    function renderTagCloud() {
      const tagCounts = {};
      diaries.forEach(d => {
        if (d.tags) d.tags.forEach(t => tagCounts[t] = (tagCounts[t] || 0) + 1);
      });

      const container = document.getElementById('tagCloud');
      if (Object.keys(tagCounts).length === 0) {
        container.innerHTML = '<p style="color:var(--text-tertiary);">タグがありません</p>';
        return;
      }

      const counts = Object.values(tagCounts);
      const min = Math.min(...counts);
      const max = Math.max(...counts);

      container.innerHTML = Object.entries(tagCounts).map(([tag, count]) => {
        const size = max === min ? 16 : 12 + (count - min) / (max - min) * 24;
        return `<span class="cloud-tag" style="font-size:${size}px">#${tag}</span>`;
      }).join('');
    }

    // Template logic
    function toggleTemplates() {
      const dropdown = document.getElementById('templateDropdown');
      const isActive = dropdown.classList.contains('active');

      if (!isActive) {
        renderTemplateList();
        dropdown.classList.add('active');

        const closeDropdown = (e) => {
          if (!e.target.closest('.template-btn')) {
            dropdown.classList.remove('active');
            document.removeEventListener('click', closeDropdown);
          }
        };
        setTimeout(() => document.addEventListener('click', closeDropdown), 0);
      } else {
        dropdown.classList.remove('active');
      }
    }

    function renderTemplateList() {
      const dropdown = document.getElementById('templateDropdown');
      dropdown.innerHTML = templates.map(t => `
        <div class="template-item" onclick="applyTemplate('${t.name}')">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
            <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
          </svg>
          ${t.name}
        </div>
      `).join('');
    }

    async function applyTemplate(name) {
      const template = templates.find(t => t.name === name);
      const editor = document.getElementById('diaryEditor');

      if (editor.innerHTML.trim() !== '' && editor.innerHTML !== '<br>') {
        const confirmed = await customConfirm('現在の内容がテンプレートで上書きされますがよろしいですか？', 'テンプレートの適用');
        if (!confirmed) return;
      }

      editor.innerHTML = template.content;
      updateCharCount();
      document.getElementById('templateDropdown').classList.remove('active');
    }

    // Initialize
    loadData();
    renderDiaries();
    renderCalendar();
    renderEvents();

  </script>
</body>
