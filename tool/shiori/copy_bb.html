<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"="width=device-width, initial-scale=1.0">
  <title>栞</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;500;700&family=M+PLUS+Rounded+1c:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #faf8f5;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f0ede8;
      --accent-primary: #9b8b7e;
      --accent-secondary: #d4c5b9;
      --accent-tertiary: #e8dfd7;
      --text-primary: #1c1b1f;
      --text-secondary: #49454f;
      --text-tertiary: #79747e;
      --border-color: #cac4d0;
      --error-color: #b3261e;
      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-2: 0 2px 6px rgba(0, 0, 0, 0.08);
      --shadow-3: 0 4px 12px rgba(0, 0, 0, 0.12);
      --font-family: 'Zen Kaku Gothic New', sans-serif;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background-color 0.3s;
    }

    /* Desktop Sidebar */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 280px;
      height: 100vh;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      z-index: 100;
    }

    .logo {
      font-size: 28px;
      font-weight: 500;
      color: var(--accent-primary);
      margin-bottom: 32px;
      padding: 8px 16px;
      letter-spacing: 2px;
    }

    .nav-list {
      list-style: none;
      flex: 1;
    }

    .nav-list-item {
      margin-bottom: 4px;
    }

    .nav-button {
      width: 100%;
      padding: 12px 24px 12px 16px;
      background: none;
      border: none;
      border-radius: 28px;
      cursor: pointer;
      font-size: 15px;
      font-family: inherit;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      text-align: left;
    }

    .nav-button:hover {
      background-color: var(--accent-tertiary);
    }

    .nav-button.active {
      background-color: var(--accent-secondary);
      color: var(--text-primary);
      font-weight: 500;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    /* Main Content */
    .main-content {
      margin-left: 280px;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .page {
      display: none;
      animation: fadeIn 0.3s;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-header {
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-title {
      font-size: 32px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .selection-mode-bar {
      display: none;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      background-color: var(--accent-tertiary);
      border-radius: 16px;
      margin-bottom: 24px;
    }

    .selection-mode-bar.active {
      display: flex;
    }

    /* Cards */
    .diary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .diary-card {
      background-color: var(--bg-secondary);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: var(--shadow-1);
      position: relative;
    }

    .diary-card:hover {
      box-shadow: var(--shadow-2);
      transform: translateY(-2px);
    }

    .diary-card.selected {
      border-color: var(--accent-primary);
      background-color: var(--accent-tertiary);
    }

    .diary-card-checkbox {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      display: none;
      cursor: pointer;
    }

    .selection-mode .diary-card-checkbox {
      display: block;
    }

    .diary-card.selected .diary-card-checkbox {
      background-color: var(--accent-primary);
      border-color: var(--accent-primary);
    }

    .diary-date {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-bottom: 12px;
    }

    .diary-preview {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Buttons */
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background-color: var(--accent-primary);
      color: white;
    }

    .btn-primary:hover {
      box-shadow: var(--shadow-2);
    }

    .btn-secondary {
      background-color: var(--accent-tertiary);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background-color: var(--accent-secondary);
    }

    .btn-text {
      background: none;
      color: var(--accent-primary);
      padding: 8px 16px;
    }

    .btn-text:hover {
      background-color: var(--accent-tertiary);
    }

    .btn-icon {
      width: 18px;
      height: 18px;
    }

    .fab {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background-color: var(--accent-primary);
      color: white;
      border: none;
      font-size: 24px;
      cursor: pointer;
      box-shadow: var(--shadow-3);
      transition: all 0.2s;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fab:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      overflow-y: auto;
      padding: 24px;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background-color: var(--bg-secondary);
      padding: 32px;
      border-radius: 28px;
      width: 100%;
      max-width: 800px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .close-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: background-color 0.2s;
    }

    .close-btn:hover {
      background-color: var(--accent-tertiary);
    }

    /* Editor */
    .editor-container {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background-color: var(--bg-primary);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .editor-toolbar {
      display: flex;
      gap: 4px;
      padding: 8px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-secondary);
      flex-wrap: wrap;
    }

    .editor-btn {
      padding: 8px 12px;
      background: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-family: inherit;
    }

    .editor-btn:hover {
      background-color: var(--accent-tertiary);
    }

    .editor-btn.active {
      background-color: var(--accent-secondary);
      color: var(--text-primary);
    }

    .editor-separator {
      width: 1px;
      background-color: var(--border-color);
      margin: 4px 4px;
    }

    .editor-select {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-primary);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .editor {
      width: 100%;
      min-height: 400px;
      padding: 24px;
      border: none;
      font-size: 15px;
      line-height: 1.8;
      font-family: inherit;
      resize: vertical;
      outline: none;
      color: var(--text-primary);
    }

    .editor:focus {
      outline: none;
    }

    /* Calendar */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 16px;
      background-color: var(--bg-secondary);
      border-radius: 16px;
    }

    .calendar-nav-btn {
      background: none;
      border: none;
      padding: 8px;
      border-radius: 50%;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .calendar-nav-btn:hover {
      background-color: var(--accent-tertiary);
    }

    .calendar-month {
      font-size: 20px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 32px;
    }

    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-secondary);
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      position: relative;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .calendar-day:hover {
      background-color: var(--accent-tertiary);
    }

    .calendar-day.has-event {
      border-color: var(--accent-primary);
    }

    .calendar-day.has-event::after {
      content: '';
      position: absolute;
      bottom: 6px;
      width: 4px;
      height: 4px;
      background-color: var(--accent-primary);
      border-radius: 50%;
    }

    .calendar-day.header {
      background-color: transparent;
      font-weight: 500;
      color: var(--text-tertiary);
      cursor: default;
    }

    .calendar-day.header:hover {
      background-color: transparent;
    }

    /* Events */
    .event-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .event-item {
      background-color: var(--bg-secondary);
      padding: 16px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
      position: relative;
    }

    .event-item.selected {
      border-color: var(--accent-primary);
      background-color: var(--accent-tertiary);
    }

    .event-checkbox {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border-color);
      border-radius: 4px;
      display: none;
      cursor: pointer;
    }

    .selection-mode .event-checkbox {
      display: block;
    }

    .event-item.selected .event-checkbox {
      background-color: var(--accent-primary);
      border-color: var(--accent-primary);
    }

    /* Settings */
    .settings-section {
      background-color: var(--bg-secondary);
      padding: 24px;
      border-radius: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .settings-title {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 20px;
      color: var(--text-primary);
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .color-picker-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .color-picker-label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .color-input-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .color-input {
      width: 48px;
      height: 48px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .color-input:hover {
      transform: scale(1.05);
    }

    .color-input::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-input::-webkit-color-swatch {
      border: none;
      border-radius: 10px;
    }

    .color-hex {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }

    .theme-presets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .theme-preset {
      padding: 16px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .theme-preset:hover {
      border-color: var(--accent-primary);
      transform: translateY(-2px);
    }

    .theme-preset-name {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .theme-preset-colors {
      display: flex;
      gap: 4px;
      justify-content: center;
    }

    .theme-preset-color {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
    }

    .font-selector {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      background-color: var(--bg-primary);
      font-family: inherit;
      cursor: pointer;
    }

    /* Input */
    input[type="text"],
    input[type="date"],
    input[type="time"],
    textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 12px;
      background-color: var(--bg-primary);
      font-family: inherit;
      color: var(--text-primary);
      transition: border-color 0.2s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent-primary);
    }

    /* Mobile Bottom Nav */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      padding: 8px 0;
      z-index: 100;
    }

    .bottom-nav-list {
      display: flex;
      justify-content: space-around;
      list-style: none;
    }

    .bottom-nav-item {
      flex: 1;
      text-align: center;
    }

    .bottom-nav-button {
      width: 100%;
      padding: 8px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      font-size: 12px;
      font-family: inherit;
      border-radius: 12px;
      transition: all 0.2s;
    }

    .bottom-nav-button.active {
      color: var(--accent-primary);
    }

    .bottom-nav-icon {
      width: 24px;
      height: 24px;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .main-content {
        margin-left: 0;
        padding: 16px;
        padding-bottom: 80px;
      }

      .bottom-nav {
        display: block;
      }

      .fab {
        bottom: 80px;
        right: 16px;
      }

      .page-title {
        font-size: 24px;
      }

      .diary-grid {
        grid-template-columns: 1fr;
      }

      .modal-content {
        padding: 20px;
        border-radius: 20px;
      }

      .editor {
        min-height: 300px;
        padding: 16px;
      }

      .color-grid {
        grid-template-columns: 1fr;
      }

      .theme-presets {
        grid-template-columns: repeat(2, 1fr);
      }

      .calendar-grid {
        gap: 4px;
      }

      .calendar-day {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <!-- Desktop Sidebar -->
  <nav class="sidebar">
    <div class="logo">栞</div>
    <ul class="nav-list">
      <li class="nav-list-item">
        <button class="nav-button active" onclick="switchPage('diary')">
          <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 4c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1.4c0-2 4-3.1 6-3.1s6 1.1 6 3.1V19z" />
          </svg>
          日記
        </button>
      </li>
      <li class="nav-list-item">
        <button class="nav-button" onclick="switchPage('calendar')">
          <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z" />
          </svg>
          カレンダー
        </button>
      </li>
      <li class="nav-list-item">
        <button class="nav-button" onclick="switchPage('settings')">
          <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
          </svg>
          設定
        </button>
      </li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      <!-- Diary Page -->
      <div id="diary" class="page active">
        <div class="page-header">
          <h1 class="page-title">日記</h1>
          <button class="btn btn-text" onclick="toggleSelectionMode('diary')">
            <svg class="btn-icon" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM17.99 9l-1.41-1.42-6.59 6.59-2.58-2.57-1.42 1.41 4 3.99z" />
            </svg>
            選択
          </button>
        </div>
        <div class="selection-mode-bar" id="diarySelectionBar">
          <span id="diarySelectedCount">0件選択中</span>
          <button class="btn btn-primary" onclick="deleteSelectedDiaries()">
            <svg class="btn-icon" fill="currentColor" viewBox="0 0 24 24">
              <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
            </svg>
            削除
          </button>
          <button class="btn btn-secondary" onclick="cancelSelection('diary')">キャンセル</button>
        </div>
        <div class="diary-grid" id="diaryList"></div>
      </div>

      <!-- Calendar Page -->
      <div id="calendar" class="page">
        <div class="page-header">

        bgPrimary: '#e8f4f8', bgSecondary: '#ffffff', bgTertiary: '#d4eaf2',
        accentPrimary: '#5b9aa9', accentSecondary: '#a8d5e2', accentTertiary: '#d4eaf2',
        textPrimary: '#1a3a45', textSecondary: '#2d5564', textTertiary: '#5b7e8c',
        borderColor: '#a8cfd8'
      },
      forest: {
        bgPrimary: '#f0f4ed', bgSecondary: '#ffffff', bgTertiary: '#e3ebe0',
        accentPrimary: '#6b8e6f', accentSecondary: '#b4c7b8', accentTertiary: '#d9e4db',
        textPrimary: '#2a3e2c', textSecondary: '#3d5940', textTertiary: '#6b7e6d',
        borderColor: '#b4c7b8'
      },
      sunset: {
        bgPrimary: '#fdf5f0', bgSecondary: '#ffffff', bgTertiary: '#f9ebe3',
        accentPrimary: '#c67b5c', accentSecondary: '#e8baa8', accentTertiary: '#f4d9cc',
        textPrimary: '#3e2a23', textSecondary: '#5c4037', textTertiary: '#8d7267',
        borderColor: '#e8baa8'
      },
      lavender: {
        bgPrimary: '#f5f3f8', bgSecondary: '#ffffff', bgTertiary: '#ebe8f0',
        accentPrimary: '#9b8ba5', accentSecondary: '#cdc5d4', accentTertiary: '#e8e4ed',
        textPrimary: '#2a1f35', textSecondary: '#453a51', textTertiary: '#6e647a',
        borderColor: '#cdc5d4'
      },
      monochrome: {
        bgPrimary: '#f5f5f5', bgSecondary: '#ffffff', bgTertiary: '#eeeeee',
        accentPrimary: '#666666', accentSecondary: '#aaaaaa', accentTertiary: '#dddddd',
        textPrimary: '#222222', textSecondary: '#555555', textTertiary: '#888888',
        borderColor: '#cccccc'
      }
    };

    // Load data from localStorage
    function loadData() {
      const savedDiaries = localStorage.getItem('shiori_diaries');
      const savedEvents = localStorage.getItem('shiori_events');
      const savedTheme = localStorage.getItem('shiori_theme');
      const savedFont = localStorage.getItem('shiori_font');

      if (savedDiaries) diaries = JSON.parse(savedDiaries);
      if (savedEvents) events = JSON.parse(savedEvents);
      if (savedTheme) applyThemeColors(JSON.parse(savedTheme));
      if (savedFont) {
        document.documentElement.style.setProperty('--font-family', savedFont);
        document.getElementById('fontSelector').value = savedFont;
      }
    }

    // Save data to localStorage
    function saveDiaries() {
      localStorage.setItem('shiori_diaries', JSON.stringify(diaries));
    }

    function saveEvents() {
      localStorage.setItem('shiori_events', JSON.stringify(events));
    }

    // Page switching
    function switchPage(pageName) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageName).classList.add('active');

      document.querySelectorAll('.nav-button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.bottom-nav-button').forEach(btn => btn.classList.remove('active'));

      event.currentTarget.classList.add('active');

      if (pageName === 'diary') renderDiaries();
      if (pageName === 'calendar') {
        renderCalendar();
        renderEvents();
      }
    }

    // Diary functions
    function openEditor(id = null) {
      editingDiaryId = id;
      const modal = document.getElementById('editorModal');
      const editor = document.getElementById('diaryEditor');
      const title = modal.querySelector('.modal-title');

      if (id) {
        const diary = diaries.find(d => d.id === id);
        editor.innerHTML = diary.content;
        title.textContent = '日記を編集';
      } else {
        editor.innerHTML = '';
        title.textContent = '日記を書く';
      }

      modal.classList.add('active');
      editor.focus();
    }

    function closeEditor() {
      document.getElementById('editorModal').classList.remove('active');
      editingDiaryId = null;
    }

    function saveDiary() {
      const content = document.getElementById('diaryEditor').innerHTML;
      if (!content.trim()) {
        alert('内容を入力してください');
        return;
      }

      if (editingDiaryId) {
        const diary = diaries.find(d => d.id === editingDiaryId);
        diary.content = content;
        diary.updatedAt = new Date().toISOString();
      } else {
        diaries.unshift({
          id: Date.now(),
          content: content,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });
      }

      saveDiaries();
      renderDiaries();
      closeEditor();
    }

    function renderDiaries() {
      const list = document.getElementById('diaryList');
      list.innerHTML = '';

      diaries.forEach(diary => {
        const card = document.createElement('div');
        card.className = 'diary-card';
        if (selectedItems.diary.has(diary.id)) card.classList.add('selected');

        const date = new Date(diary.createdAt);
        const dateStr = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;

        const preview = document.createElement('div');
        preview.className = 'diary-preview';
        preview.innerHTML = diary.content;

        card.innerHTML = `
          <div class="diary-card-checkbox" onclick="toggleDiarySelection(${diary.id}, event)"></div>
          <div class="diary-date">${dateStr}</div>
        `;
        card.appendChild(preview);

        card.onclick = (e) => {
          if (!selectionMode.diary && !e.target.classList.contains('diary-card-checkbox')) {
            openEditor(diary.id);
          }
        };

        list.appendChild(card);
      });

      if (diaries.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:var(--text-tertiary); padding:40px;">まだ日記がありません</p>';
      }
    }

    // Selection mode
    function toggleSelectionMode(type) {
      selectionMode[type] = !selectionMode[type];
      selectedItems[type].clear();

      const container = document.getElementById(type === 'diary' ? 'diary' : 'calendar');
      if (selectionMode[type]) {
        container.classList.add('selection-mode');
      } else {
        container.classList.remove('selection-mode');
      }

      const bar = document.getElementById(type === 'diary' ? 'diarySelectionBar' : 'eventSelectionBar');
      bar.classList.toggle('active', selectionMode[type]);

      if (type === 'diary') renderDiaries();
      if (type === 'event') renderEvents();
      updateSelectionCount(type);
    }

    function toggleDiarySelection(id, event) {
      event.stopPropagation();
      if (selectedItems.diary.has(id)) {
        selectedItems.diary.delete(id);
      } else {
        selectedItems.diary.add(id);
      }
      renderDiaries();
      updateSelectionCount('diary');
    }

    function toggleEventSelection(id, event) {
      event.stopPropagation();
      if (selectedItems.event.has(id)) {
        selectedItems.event.delete(id);
      } else {
        selectedItems.event.add(id);
      }
      renderEvents();
      updateSelectionCount('event');
    }

    function updateSelectionCount(type) {
      const countEl = document.getElementById(type === 'diary' ? 'diarySelectedCount' : 'eventSelectedCount');
      countEl.textContent = `${selectedItems[type].size}件選択中`;
    }

    function deleteSelectedDiaries() {
      if (selectedItems.diary.size === 0) return;
      if (!confirm(`${selectedItems.diary.size}件の日記を削除しますか?`)) return;

      diaries = diaries.filter(d => !selectedItems.diary.has(d.id));
      saveDiaries();
      cancelSelection('diary');
    }

    function deleteSelectedEvents() {
      if (selectedItems.event.size === 0) return;
      if (!confirm(`${selectedItems.event.size}件の予定を削除しますか?`)) return;

      events = events.filter(e => !selectedItems.event.has(e.id));
      saveEvents();
      cancelSelection('event');
    }

    function cancelSelection(type) {
      toggleSelectionMode(type);
    }

    // Editor commands
    function execCmd(command, value = null) {
      document.execCommand(command, false, value);
    }

    function insertHeading(tag) {
      const selection = window.getSelection();
      if (selection.rangeCount > 0) {
        const range = selection.getRangeAt(0);
        const heading = document.createElement(tag);
        heading.textContent = selection.toString() || `見出し ${tag.toUpperCase()}`;
        range.deleteContents();
        range.insertNode(heading);
      }
    }

    // Calendar functions
    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const monthEl = document.getElementById('currentMonth');

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      monthEl.textContent = `${year}年${month + 1}月`;

      grid.innerHTML = '';

      const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
      dayNames.forEach(name => {
        const day = document.createElement('div');
        day.className = 'calendar-day header';
        day.textContent = name;
        grid.appendChild(day);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'calendar-day';
        empty.style.visibility = 'hidden';
        grid.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const hasEvent = events.some(e => e.date === dateStr);

        const dayEl = document.createElement('div');
        dayEl.className = 'calendar-day';
        if (hasEvent) dayEl.classList.add('has-event');
        dayEl.textContent = day;
        dayEl.onclick = () => openEventModal(dateStr);
        grid.appendChild(dayEl);
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
      renderEvents();
    }

    function openEventModal(date = null) {
      const modal = document.getElementById('eventModal');
      if (date) {
        document.getElementById('eventDate').value = date;
      } else {
        document.getElementById('eventDate').value = '';
      }
      document.getElementById('eventTime').value = '';
      document.getElementById('eventTitle').value = '';
      document.getElementById('eventDescription').value = '';
      modal.classList.add('active');
    }

    function closeEventModal() {
      document.getElementById('eventModal').classList.remove('active');
    }

    function saveEvent() {
      const date = document.getElementById('eventDate').value;
      const time = document.getElementById('eventTime').value;
      const title = document.getElementById('eventTitle').value;
      const description = document.getElementById('eventDescription').value;

      if (!date || !title) {
        alert('日付とタイトルを入力してください');
        return;
      }

      events.push({
        id: Date.now(),
        date: date,
        time: time,
        title: title,
        description: description
      });

      events.sort((a, b) => {
        const dateA = new Date(a.date + ' ' + (a.time || '00:00'));
        const dateB = new Date(b.date + ' ' + (b.time || '00:00'));
        return dateA - dateB;
      });

      saveEvents();
      renderCalendar();
      renderEvents();
      closeEventModal();
    }

    function renderEvents() {
      const list = document.getElementById('eventList');
      list.innerHTML = '';

      const now = new Date();
      const upcomingEvents = events.filter(e => new Date(e.date) >= now);

      upcomingEvents.forEach(event => {
        const item = document.createElement('div');
        item.className = 'event-item';
        if (selectedItems.event.has(event.id)) item.classList.add('selected');

        const date = new Date(event.date);
        const dateStr = `${date.getMonth() + 1}月${date.getDate()}日`;
        const timeStr = event.time ? ` ${event.time}` : '';

        item.innerHTML = `
          <div class="event-checkbox" onclick="toggleEventSelection(${event.id}, event)"></div>
          <div>
            <div style="font-weight:500; margin-bottom:4px;">${event.title}</div>
            <div style="font-size:13px; color:var(--text-tertiary);">${dateStr}${timeStr}</div>
            ${event.description ? `<div style="font-size:13px; color:var(--text-secondary); margin-top:4px;">${event.description}</div>` : ''}
          </div>
        `;

        list.appendChild(item);
      });

      if (upcomingEvents.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:var(--text-tertiary); padding:40px;">予定がありません</p>';
      }
    }

    // Theme functions
    function updateFont() {
      const font = document.getElementById('fontSelector').value;
      document.documentElement.style.setProperty('--font-family', font);
      localStorage.setItem('shiori_font', font);
    }

    function applyPreset(presetName) {
      const preset = themePresets[presetName];
      applyThemeColors(preset);
      updateColorInputs(preset);
      localStorage.setItem('shiori_theme', JSON.stringify(preset));
    }

    function applyThemeColors(colors) {
      document.documentElement.style.setProperty('--bg-primary', colors.bgPrimary);
      document.documentElement.style.setProperty('--bg-secondary', colors.bgSecondary);
      document.documentElement.style.setProperty('--bg-tertiary', colors.bgTertiary);
      document.documentElement.style.setProperty('--accent-primary', colors.accentPrimary);
      document.documentElement.style.setProperty('--accent-secondary', colors.accentSecondary);
      document.documentElement.style.setProperty('--accent-tertiary', colors.accentTertiary);
      document.documentElement.style.setProperty('--text-primary', colors.textPrimary);
      document.documentElement.style.setProperty('--text-secondary', colors.textSecondary);
      document.documentElement.style.setProperty('--text-tertiary', colors.textTertiary);
      document.documentElement.style.setProperty('--border-color', colors.borderColor);
    }

    function updateColorInputs(colors) {
      document.getElementById('bgPrimary').value = colors.bgPrimary;
      document.getElementById('bgPrimaryHex').value = colors.bgPrimary;
      document.getElementById('bgSecondary').value = colors.bgSecondary;
      document.getElementById('bgSecondaryHex').value = colors.bgSecondary;
      document.getElementById('bgTertiary').value = colors.bgTertiary;
      document.getElementById('bgTertiaryHex').value = colors.bgTertiary;
      document.getElementById('accentPrimary').value = colors.accentPrimary;
      document.getElementById('accentPrimaryHex').value = colors.accentPrimary;
      document.getElementById('accentSecondary').value = colors.accentSecondary;
      document.getElementById('accentSecondaryHex').value = colors.accentSecondary;
      document.getElementById('accentTertiary').value = colors.accentTertiary;
      document.getElementById('accentTertiaryHex').value = colors.accentTertiary;
      document.getElementById('textPrimary').value = colors.textPrimary;
      document.getElementById('textPrimaryHex').value = colors.textPrimary;
      document.getElementById('textSecondary').value = colors.textSecondary;
      document.getElementById('textSecondaryHex').value = colors.textSecondary;
      document.getElementById('textTertiary').value = colors.textTertiary;
      document.getElementById('textTertiaryHex').value = colors.textTertiary;
      document.getElementById('borderColor').value = colors.borderColor;
      document.getElementById('borderColorHex').value = colors.borderColor;
    }

    function updateCustomTheme() {
      const colors = {
        bgPrimary: document.getElementById('bgPrimary').value,
        bgSecondary: document.getElementById('bgSecondary').value,
        bgTertiary: document.getElementById('bgTertiary').value,
        accentPrimary: document.getElementById('accentPrimary').value,
        accentSecondary: document.getElementById('accentSecondary').value,
        accentTertiary: document.getElementById('accentTertiary').value,
        textPrimary: document.getElementById('textPrimary').value,
        textSecondary: document.getElementById('textSecondary').value,
        textTertiary: document.getElementById('textTertiary').value,
        borderColor: document.getElementById('borderColor').value
      };

      applyThemeColors(colors);
      updateColorInputs(colors);
      localStorage.setItem('shiori_theme', JSON.stringify(colors));
    }

    function syncColorPicker(id) {
      const hexInput = document.getElementById(id + 'Hex');
      const colorInput = document.getElementById(id);
      colorInput.value = hexInput.value;
      updateCustomTheme();
    }

    function resetTheme() {
      if (!confirm('テーマをデフォルトに戻しますか?')) return;
      localStorage.removeItem('shiori_theme');
      applyPreset('default');
    }

    // Initialize
    loadData();
    renderDiaries();
    renderCalendar();
    renderEvents();
  </script>
</body>

</html>
