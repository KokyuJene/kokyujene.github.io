<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy UI Ultimate Collection</title>
    <style>
        :root {
            --bg: #fdfdfd;
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --accent: #ffe66d;
            --dark: #2f3542;
            --purple: #a29bfe;
            --green: #badc58;
        }

        body {
            background-color: var(--bg);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 40px;
            font-family: 'Hiragino Maru Gothic ProN', sans-serif;
            color: var(--dark);
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.05);
            border: 2px solid #eee;
            min-height: 180px;
        }

        label { font-size: 12px; font-weight: 900; color: #ccc; letter-spacing: 1px; }

        /* 1. ハンバーガーメニュー */
        .menu-btn {
            width: 50px; height: 50px; background: none; border: none; cursor: pointer;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px;
        }
        .line {
            width: 30px; height: 5px; background: var(--primary); border-radius: 5px;
            transition: 0.4s cubic-bezier(0.68, -0.6, 0.32, 1.6);
        }
        .open .line:nth-child(1) { transform: translateY(11px) rotate(45deg); }
        .open .line:nth-child(2) { opacity: 0; transform: scale(0); }
        .open .line:nth-child(3) { transform: translateY(-11px) rotate(-45deg); }

        /* 2. トグルスイッチ */
        .toggle {
            width: 70px; height: 36px; background: #ddd; border-radius: 20px;
            position: relative; cursor: pointer; transition: 0.3s;
        }
        .toggle-circle {
            width: 28px; height: 28px; background: white; border-radius: 50%;
            position: absolute; top: 4px; left: 4px; transition: 0.4s cubic-bezier(0.68, -0.6, 0.32, 1.6);
        }
        .active.toggle { background: var(--secondary); }
        .active .toggle-circle { left: 38px; transform: scale(1.1); }

        /* 3. プラスからバツ */
        .plus-btn {
            width: 50px; height: 50px; background: var(--accent); border: none;
            border-radius: 50%; cursor: pointer; position: relative;
            box-shadow: 0 5px 0 #eed355; transition: 0.1s;
        }
        .plus-btn::before, .plus-btn::after {
            content: ""; position: absolute; background: var(--dark);
            top: 50%; left: 50%; transform: translate(-50%, -50%); transition: 0.4s cubic-bezier(0.68, -0.6, 0.32, 1.6);
        }
        .plus-btn::before { width: 4px; height: 20px; }
        .plus-btn::after { width: 20px; height: 4px; }
        .active.plus-btn { transform: translateY(3px); box-shadow: 0 2px 0 #eed355; rotate: 135deg; }

        /* 4. ふわふわ浮遊 */
        .fab {
            padding: 12px 24px; background: var(--purple); color: white;
            border: none; border-radius: 50px; font-weight: bold; cursor: pointer;
            animation: float 2s infinite ease-in-out; box-shadow: 0 8px 15px rgba(162, 155, 254, 0.4);
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* 5. ぷるぷる震えるエラー (Shake) */
        .input-shake {
            padding: 10px; border: 3px solid #eee; border-radius: 10px; outline: none;
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; border-color: var(--primary); }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* 6. チェックで跳ねる星 */
        .checkbox-wrapper { cursor: pointer; font-size: 30px; position: relative; }
        .checkbox-wrapper input { display: none; }
        .star { color: #ddd; transition: 0.3s; display: inline-block; }
        input:checked ~ .star { 
            color: var(--accent); transform: scale(1.5) rotate(72deg);
            text-shadow: 0 0 10px rgba(255, 230, 109, 0.8);
        }

        /* 7. 跳ねる通知 (Bounce Badge) */
        .notify-btn {
            position: relative; padding: 10px 20px; background: #eee; border-radius: 10px; border: none;
        }
        .badge {
            position: absolute; top: -10px; right: -10px;
            background: var(--primary); color: white; width: 24px; height: 24px;
            border-radius: 50%; font-size: 12px; display: flex; align-items: center;
            justify-content: center; animation: notify-jump 1s infinite;
        }
        @keyframes notify-jump {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* 8. くるくる読み込み中 */
        .loader {
            width: 40px; height: 40px; border: 5px solid #f3f3f3;
            border-top: 5px solid var(--secondary); border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 9. 吸い込まれる削除 */
        .trash-btn {
            padding: 10px 20px; background: var(--dark); color: white; border: none;
            border-radius: 10px; cursor: pointer; transition: 0.3s;
        }
        .trash-btn:active { transform: scale(0); opacity: 0; }

        /* 10. めくれるカード (Flip) */
        .flip-card { width: 100px; height: 60px; perspective: 1000px; cursor: pointer; }
        .flip-inner {
            position: relative; width: 100%; height: 100%; text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-card.active .flip-inner { transform: rotateY(180deg); }
        .front, .back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; align-items: center; justify-content: center; border-radius: 10px;
            font-weight: bold; color: white;
        }
        .front { background: var(--green); }
        .back { background: var(--primary); transform: rotateY(180deg); }

    </style>
</head>
<body>

    <div class="card">
        <button class="menu-btn" onclick="this.classList.toggle('open')">
            <div class="line"></div><div class="line"></div><div class="line"></div>
        </button>
        <label>01. HAMBURGER</label>
    </div>

    <div class="card">
        <div class="toggle" onclick="this.classList.toggle('active')">
            <div class="toggle-circle"></div>
        </div>
        <label>02. ELASTIC TOGGLE</label>
    </div>

    <div class="card">
        <button class="plus-btn" onclick="this.classList.toggle('active')"></button>
        <label>03. ADD & ROTATE</label>
    </div>

    <div class="card">
        <button class="fab">TOUCH ME</button>
        <label>04. FLOAT BUTTON</label>
    </div>

    <div class="card">
        <input type="text" class="input-shake" placeholder="Error Here..." onfocus="this.classList.remove('shake')" onblur="this.classList.add('shake')">
        <label>05. SHAKE INPUT</label>
    </div>

    <div class="card">
        <label class="checkbox-wrapper">
            <input type="checkbox">
            <span class="star">★</span>
        </label>
        <label>06. STAR CHECK</label>
    </div>

    <div class="card">
        <button class="notify-btn">
            Inbox <span class="badge">1</span>
        </button>
        <label>07. BOUNCE NOTIFY</label>
    </div>

    <div class="card">
        <div class="loader"></div>
        <label>08. ELASTIC SPIN</label>
    </div>

    <div class="card">
        <button class="trash-btn">DELETE</button>
        <label>09. SHRINK DISAPPEAR</label>
    </div>

    <div class="card">
        <div class="flip-card" onclick="this.classList.toggle('active')">
            <div class="flip-inner">
                <div class="front">HELLO</div>
                <div class="back">BYE!</div>
            </div>
        </div>
        <label>10. CARD FLIP</label>
    </div>

</body>
</html>
